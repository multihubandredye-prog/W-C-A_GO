  function fieldLabel(key) {
    const labels = {
      id: 'ID do documento', name: 'Nome', nome: 'Nome', phone: 'Telefone', phoneMasked: 'Telefone mascarado',
      status: 'Status', plan: 'Plano atual', requestedPlan: 'Plano solicitado', requestedMonths: 'Meses solicitados',
      requestedAmount: 'Valor solicitado', project_expiration: 'Vencimento', expiration: 'Vencimento', expiracao: 'Vencimento',
      createdAt: 'Criado em', created_at: 'Criado em', updatedAt: 'Atualizado em', lastRequestAt: 'Última solicitação',
      lastRequestAtBR: 'Última solicitação BR', lastPaymentAt: 'Último pagamento', cancelledAt: 'Cancelado em',
      lastActivatedDays: 'Últimos dias ativados', source: 'Origem', vip: 'VIP'
    };
    return labels[key] || key.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').trim();
  }

  function detailValue(value) {
    if (value === undefined || value === null || value === '') return '—';
    if (typeof value === 'boolean') return value ? 'Sim' : 'Não';
    if (Array.isArray(value) || typeof value === 'object') return JSON.stringify(value, null, 2);
    const s = String(value);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(s);
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return fmtCreated(s);
    return s;
  }

  function detailItem(label, value) {
    return `<div class="detail-item"><div class="detail-label">${esc(label)}</div><div class="detail-value">${esc(detailValue(value))}</div></div>`;
  }

  function renderPaymentHistory(payments) {
    if (!payments.length) {
      return `<div class="state-container" style="padding:2rem 1rem"><span class="state-icon">🧾</span><p class="state-title">Nenhum histórico de ativação registrado</p><p class="state-sub">Quando a API receber ativações/renovações, elas aparecem aqui.</p></div>`;
    }
    return `<div class="payment-list">${payments.map((p, idx) => {
      const title = idx === 0 ? 'Ativação inicial' : `Renovação #${idx}`;
      const dur = Number(p.days || 0) > 0 ? `${p.days} dia(s)` : Number(p.months || 0) > 0 ? `${p.months} mês(es)` : 'Período não informado';
      return `<div class="payment-item">
        <div class="payment-index">${idx + 1}</div>
        <div>
          <div class="payment-title"><strong>${esc(title)}</strong><span class="date-text">${esc(detailValue(p.date || p.createdAt || ''))}</span></div>
          <div class="payment-meta">
            Duração: ${esc(dur)} · Valor: ${esc(p.amount || '—')} · Método: ${esc(p.method || '—')}
            ${p.note ? `<br/>Obs: ${esc(p.note)}` : ''}
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderDetail(u, loading = false, publicStatus = null) {
    if (!u) return;
    const raw = { ...(u.raw || {}) };
    if (!raw.name && u.name) raw.name = u.name;
    if (!raw.phone && u.phone) raw.phone = u.phone;
    const payments = Array.isArray(raw.payments) ? raw.payments : Array.isArray(u.payments) ? u.payments : [];
    const di = getDaysInfo(u);
    const activationCount = payments.length;
    const renewals = Math.max(0, activationCount - 1);
    const fields = Object.keys(raw)
      .filter(k => !['payments', 'raw'].includes(k))
      .sort((a, b) => fieldLabel(a).localeCompare(fieldLabel(b), 'pt-BR'));

    const planAction = primaryPlanActionLabel(u);
    const detailEditBtn = document.getElementById('detailEdit');
    detailEditBtn.textContent = planAction;
    detailEditBtn.title = planAction === 'Editar' ? 'Editar usuário ativo' : 'Ativar plano do usuário';
    document.getElementById('detailTitle').innerHTML = `Detalhes de <span>${esc(u.name || u.phone || 'Usuário')}</span>`;
    document.getElementById('detailCancelSub').disabled = ['cancelled', 'pending', 'muted'].includes(di.type);
    document.getElementById('detailContent').innerHTML = `
      <div class="detail-hero">
        <div class="detail-user">
          <div class="avatar">${initials(u.name)}</div>
          <div>
            <div class="detail-name">${esc(u.name || '—')}</div>
            <div class="detail-phone">${esc(displayPhone(u))}</div>
          </div>
        </div>
        <span class="status-pill ${sPill(di.type)}">${esc(sLabel(di.type))}</span>
      </div>

      ${loading ? `<div class="state-container" style="padding:1.5rem 1rem"><div class="spinner"></div><p class="state-title">Consultando dados completos na API…</p></div>` : ''}

      <div class="detail-kpi-grid">
        <div class="detail-kpi"><div class="detail-kpi-label">Ativações</div><div class="detail-kpi-value">${activationCount}</div></div>
        <div class="detail-kpi"><div class="detail-kpi-label">Renovações</div><div class="detail-kpi-value">${renewals}</div></div>
        <div class="detail-kpi"><div class="detail-kpi-label">Vencimento</div><div class="detail-kpi-value">${esc(fmtDate(u.expiry))}</div></div>
        <div class="detail-kpi"><div class="detail-kpi-label">Dias/estado</div><div class="detail-kpi-value">${esc(di.label)}</div></div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Resumo administrativo</div>
        <div class="detail-grid">
          ${detailItem('Plano atual', raw.plan || raw.plano || '—')}
          ${detailItem(hasPendingRequest(u) ? 'Plano da renovação pendente' : 'Plano solicitado', requestedPlanOf(u) || '—')}
          ${detailItem(hasPendingRequest(u) ? 'Meses da renovação pendente' : 'Meses solicitados', requestedMonthsOf(u) || '—')}
          ${detailItem(hasPendingRequest(u) ? 'Valor da renovação pendente' : 'Valor solicitado', requestedAmountOf(u) || '—')}
          ${detailItem(hasPendingRequest(u) ? 'Data da renovação pendente' : 'Última solicitação', (pendingRequestOf(u)?.lastRequestAtBR || pendingRequestOf(u)?.lastRequestAt || raw.lastRequestAtBR || raw.lastRequestAt || '—'))}
          ${detailItem('Último pagamento', raw.lastPaymentAt || '—')}
          ${detailItem('Origem', raw.source || '—')}
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Histórico de ativações e renovações</div>
        ${renderPaymentHistory(payments)}
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Todas as informações existentes</div>
        <div class="detail-grid">
          ${fields.map(k => detailItem(fieldLabel(k), raw[k])).join('') || detailItem('Sem campos', '—')}
        </div>
      </div>
    `;
  }

  async function openDetails(id) {
    const local = allUsers.find(x => x.id === id || x.phone === id);
    if (!local) return;
    selectedDetailId = local.id;
    renderDetail(local, true);
    openOverlay('detailOverlay');
    if (!local.phone) {
      renderDetail(local, false);
      return;
    }
    try {
      const data = await adminApi(`/api/premium/user?phone=${encodeURIComponent(local.phone)}`);
      if (selectedDetailId !== local.id) return;
      const full = normalizeUser({ id: local.id, ...(data.user || {}) });
      const idx = allUsers.findIndex(x => x.id === local.id || x.phone === local.phone);
      if (idx > -1) allUsers[idx] = full;
      renderDetail(full, false, data.publicStatus);
    } catch (err) {
      renderDetail(local, false);
      showToast('Não foi possível consultar detalhes completos: ' + err.message, 'error');
    }
  }

  const MODAL_STATE_VAR = 'cache_modal';
  const MODAL_RETURN_VAR = 'return_modal';
  let overlayStack = [];
  let lastReturnSignal = '';

  function syncOverlayState() {
    overlayStack = overlayStack.filter(id => document.getElementById(id)?.classList.contains('open'));
    const top = overlayStack.length ? overlayStack[overlayStack.length - 1] : '';
    try {
      if (typeof Tasker !== 'undefined' && typeof Tasker.setVariable === 'function') Tasker.setVariable(MODAL_STATE_VAR, top);
    } catch (_) { }
  }

  function openOverlay(id) {
    document.getElementById(id).classList.add('open');
    overlayStack = overlayStack.filter(item => item !== id);
    overlayStack.push(id);
    syncOverlayState();
  }

  function closeOverlay(id) {
    document.getElementById(id).classList.remove('open');
    overlayStack = overlayStack.filter(item => item !== id);
    syncOverlayState();
  }

  function closeTopOverlay() {
    overlayStack = overlayStack.filter(id => document.getElementById(id)?.classList.contains('open'));
    const top = overlayStack[overlayStack.length - 1];
    if (top) closeOverlay(top);
  }

  function consumeReturnSignal(value) {
    const signal = String(value == null ? '' : value);
    if (!signal || signal === lastReturnSignal) return;
    lastReturnSignal = signal;
    closeTopOverlay();
    try {
      if (typeof Tasker !== 'undefined' && typeof Tasker.setVariable === 'function') Tasker.setVariable(MODAL_RETURN_VAR, '');
    } catch (_) { }
    setTimeout(() => { lastReturnSignal = ''; }, 250);
  }

  try {
    if (typeof Tasker !== 'undefined' && typeof Tasker.onVariableChanged === 'function') {
      Tasker.onVariableChanged(MODAL_RETURN_VAR, function (nome, valor) { consumeReturnSignal(valor); });
    }
  } catch (_) { }

  setInterval(function () {
    try {
      if (typeof Tasker === 'undefined' || typeof Tasker.getVariable !== 'function') return;
      Promise.resolve(Tasker.getVariable(MODAL_RETURN_VAR)).then(consumeReturnSignal).catch(function () { });
    } catch (_) { }
  }, 450);
  setTimeout(syncOverlayState, 100);

  const phoneErrorEl = document.getElementById('phoneError');
  const fieldPhone = document.getElementById('fieldPhone');

  fieldPhone.addEventListener('input', () => {
    fieldPhone.value = fieldPhone.value.replace(/\D/g, '').slice(0, 13);
    validatePhone();
  });

  function validatePhone() {
    const digits = fieldPhone.value.replace(/\D/g, '');
    if (!digits.length) {
      phoneErrorEl.textContent = '';
      return false;
    }
    if (digits.length < 12) {
      phoneErrorEl.style.color = 'var(--warning)';
      phoneErrorEl.textContent = `Número curto (${digits.length}/12 mín) `;
      return false;
    }
    phoneErrorEl.style.color = 'var(--success)';
    phoneErrorEl.textContent = '✓ Número válido';
    return true;
  }

  function validatePhoneStrict() {
    const digits = fieldPhone.value.replace(/\D/g, '');
    const existing = editingId ? allUsers.find(x => x.id === editingId || x.phone === editingId) : null;
    if (!digits && existing && !existing.phone) return true;
    if (digits.length < 12 || digits.length > 13) {
      phoneErrorEl.style.color = 'var(--danger)';
      phoneErrorEl.textContent = `Informe 12 ou 13 dígitos (atual: ${digits.length}).`;
      return false;
    }
    return true;
  }

  function openCreate() {
    if (!isAdmin()) return;
    editingId = null;
    document.getElementById('userModalTitle').innerHTML = 'Novo <span>usuário</span>';
    document.getElementById('userSave').textContent = 'Criar usuário';
    document.getElementById('fieldName').value = '';
    fieldPhone.value = '';
    fieldPhone.placeholder = 'Ex: 558199999999';
    document.getElementById('fieldExpiry').value = '';
    phoneErrorEl.textContent = '';
    openOverlay('userOverlay');
    setTimeout(() => document.getElementById('fieldName').focus(), 120);
  }

  function openEdit(id) {
    if (!isAdmin()) return;
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    editingId = id;
    const planAction = primaryPlanActionLabel(u);
    document.getElementById('userModalTitle').innerHTML = planAction === 'Editar' ? 'Editar <span>usuário</span>' : planAction === 'Ativar renovação' ? 'Ativar <span>renovação</span>' : 'Ativar <span>plano</span>';
    document.getElementById('userSave').textContent = planAction === 'Editar' ? 'Salvar alterações' : planAction;
    document.getElementById('fieldName').value = u.name;
    fieldPhone.value = (u.phone || '').replace(/\D/g, '');
    fieldPhone.placeholder = u.phone ? 'Ex: 558199999999' : (u.phoneMasked ? `Protegido: ${u.phoneMasked}` : 'Número protegido');
    document.getElementById('fieldExpiry').value = defaultActivationExpiry(renewalSourceFor(u));
    phoneErrorEl.textContent = u.phone ? '' : 'Número protegido pela API; ações serão feitas pelo documento seguro.';
    validatePhone();
    closeOverlay('detailOverlay');
    openOverlay('userOverlay');
    setTimeout(() => document.getElementById('fieldName').focus(), 120);
  }

  async function saveUser() {
    if (!isAdmin()) return;
    const name = document.getElementById('fieldName').value.trim();
    const phone = fieldPhone.value.replace(/\D/g, '');
    const expiry = document.getElementById('fieldExpiry').value;
    const currentEditing = editingId ? allUsers.find(x => x.id === editingId || x.phone === editingId) : null;
    const canUseProtectedDoc = Boolean(editingId && currentEditing && !currentEditing.phone);

    if (!name || !expiry || (!phone && !canUseProtectedDoc)) {
      showToast('Preencha todos os campos.', 'error');
      return;
    }
    if (!validatePhoneStrict()) {
      showToast('Número de telefone inválido.', 'error');
      return;
    }

    const btn = document.getElementById('userSave');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner spinner-sm"></div>';

    const currentActionLabel = currentEditing ? primaryPlanActionLabel(currentEditing) : '';
    const isEditingActive = currentEditing ? currentActionLabel === 'Editar' : false;

    try {
      if (editingId) {
        await updateUser(editingId, { name, phone, expiry });
        showToast(isEditingActive ? 'Usuário atualizado pela API!' : 'Plano ativado pela API!', 'success');
      } else {
        await createUser({ name, phone, expiry });
        showToast('Usuário criado e plano ativado pela API!', 'success');
      }
      closeOverlay('userOverlay');
      await fetchUsers();
    } catch (err) {
      showToast('Erro: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = editingId ? (isEditingActive ? 'Salvar alterações' : currentActionLabel || 'Ativar plano') : 'Criar usuário';
    }
  }

  function setConfirmButton(kind, text) {
    const btn = document.getElementById('confirmOk');
    btn.textContent = text;
    btn.classList.toggle('btn-danger', kind === 'danger');
    btn.classList.toggle('btn-warning', kind === 'warning');
  }

  function openConfirmDelete(id) {
    if (!isAdmin()) return;
    const u = allUsers.find(x => x.id === id || x.phone === id);
    if (!u) return;
    confirmAction = 'delete';
    confirmId = id;
    document.getElementById('confirmTitle').innerHTML = 'Remover <span>definitivo</span>';
    document.getElementById('confirmBody').innerHTML = `Deseja remover definitivamente o usuário <strong>${esc(u.name || u.phoneMasked || u.phone || u.id)}</strong>? Esta ação apaga o documento e o histórico.`;
    setConfirmButton('danger', 'Remover');
    openOverlay('confirmOverlay');
  }

  function openConfirmCancel(id) {
    if (!isAdmin()) return;
    const u = allUsers.find(x => x.id === id || x.phone === id);
    if (!u) return;
    confirmAction = 'cancel';
    confirmId = id;
    document.getElementById('confirmTitle').innerHTML = 'Cancelar <span>assinatura</span>';
    document.getElementById('confirmBody').innerHTML = `Deseja cancelar a assinatura de <strong>${esc(u.name || u.phoneMasked || u.phone || u.id)}</strong>? O cadastro e o histórico serão mantidos, mas o status muda para <strong>cancelled</strong>.`;
    setConfirmButton('warning', 'Cancelar assinatura');
    openOverlay('confirmOverlay');
  }

  function openConfirmRequestResolution(id, resolution) {
    const user = allUsers.find(item => item.id === id);
    if (!user) return;
    confirmAction = resolution;
    confirmId = id;
    const duplicate = resolution === 'duplicate';
    document.getElementById('confirmTitle').innerHTML = duplicate ? 'Marcar como <span>duplicada</span>' : 'Rejeitar <span>solicitação</span>';
    document.getElementById('confirmBody').innerHTML = duplicate
      ? `A solicitação de <strong>${esc(user.name || displayPhone(user))}</strong> será encerrada como duplicada. As outras solicitações continuarão pendentes.`
      : `A solicitação de <strong>${esc(user.name || displayPhone(user))}</strong> será rejeitada sem apagar o cadastro ou o histórico.`;
    setConfirmButton(duplicate ? 'warning' : 'danger', duplicate ? 'Marcar duplicada' : 'Rejeitar');
    openOverlay('confirmOverlay');
  }

  async function confirmDelete() {
    if (!isAdmin()) return;
    if (!confirmAction || !confirmId) return;
    const btn = document.getElementById('confirmOk');
    const original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner spinner-sm"></div>';

    try {
      if (confirmAction === 'delete') {
        await deleteUser(confirmId);
        showToast('Usuário removido definitivamente pela API.', 'info');
      } else if (confirmAction === 'cancel') {
        await cancelSubscription(confirmId);
        showToast('Assinatura cancelada pela API.', 'info');
      } else if (confirmAction === 'rejected' || confirmAction === 'duplicate') {
        await resolveRequest(confirmId, confirmAction);
        showToast(confirmAction === 'duplicate' ? 'Solicitação marcada como duplicada.' : 'Solicitação rejeitada.', 'info');
      }
      closeOverlay('detailOverlay');
      closeOverlay('confirmOverlay');
      await fetchUsers();
    } catch (err) {
      showToast('Erro na ação: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = original;
      confirmAction = null;
      confirmId = null;
    }
  }

  function buildFilterModal() {
    const c = document.getElementById('filterOptions');
    c.innerHTML = FILTERS.map(f => ` <div class="filter-option${activeFilter === f.value ? ' selected' : ''}" data-value="${f.value}"> <div class="filter-option-left"><div class="filter-dot" style="background:${f.color}"></div><span>${f.label}</span></div> <svg class="filter-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${f.color}" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> </div>`).join('');

    c.querySelectorAll('.filter-option').forEach(el => {
      el.addEventListener('click', () => {
        c.querySelectorAll('.filter-option').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        activeFilter = el.dataset.value;
        updateFilterBadge();
        closeOverlay('filterOverlay');
        applyFilters();
      });
    });
  }

  function updateFilterBadge() {
    const badge = document.getElementById('filterBadge');
    const trigger = document.getElementById('filterTrigger');
    badge.style.display = activeFilter !== 'all' ? 'inline-block' : 'none';
    trigger.classList.toggle('active', activeFilter !== 'all');
  }

  function exportData() {
    if (!allUsers.length) {
      showToast('Sem dados para exportar.', 'error');
      return;
    }
    const blob = new Blob([JSON.stringify(allUsers, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vip-users-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`${allUsers.length} usuário(s) exportados!`, 'success');
  }

  function showToast(msg, type = 'success') {
    const icons = { success: '✓', error: '✕', info: 'ℹ' };
    const t = document.getElementById('toast');
    t.innerHTML = `<span>${icons[type]||'•'}</span> ${esc(msg)}`;
    t.className = `show ${type}`;
    clearTimeout(t._t);
    t._t = setTimeout(() => {
      t.className = '';
    }, 3500);
  }

  // binds
  document.getElementById('refreshBtn').addEventListener('click', () => {
    fetchUsers();
    showToast('Atualizando…', 'info');
  });
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('addBtn').addEventListener('click', openCreate);
  document.getElementById('searchInput').addEventListener('input', applyFilters);

  document.getElementById('filterTrigger').addEventListener('click', () => {
    buildFilterModal();
    openOverlay('filterOverlay');
  });

  document.getElementById('filterClose').addEventListener('click', () => closeOverlay('filterOverlay'));
  document.getElementById('userClose').addEventListener('click', () => closeOverlay('userOverlay'));
  document.getElementById('userCancel').addEventListener('click', () => closeOverlay('userOverlay'));
  document.getElementById('userSave').addEventListener('click', saveUser);
  document.getElementById('detailClose').addEventListener('click', () => closeOverlay('detailOverlay'));
  document.getElementById('detailEdit').addEventListener('click', () => selectedDetailId && openEdit(selectedDetailId));
  document.getElementById('detailCancelSub').addEventListener('click', () => selectedDetailId && openConfirmCancel(selectedDetailId));
  document.getElementById('detailDelete').addEventListener('click', () => selectedDetailId && openConfirmDelete(selectedDetailId));
  document.getElementById('confirmClose').addEventListener('click', () => closeOverlay('confirmOverlay'));
  document.getElementById('confirmCancel').addEventListener('click', () => closeOverlay('confirmOverlay'));
  document.getElementById('confirmOk').addEventListener('click', confirmDelete);

  ['filterOverlay', 'userOverlay', 'detailOverlay', 'confirmOverlay'].forEach(id =>
    document.getElementById(id).addEventListener('click', e => {
      if (e.target.id === id) closeOverlay(id);
    })
  );

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') ['filterOverlay', 'userOverlay', 'detailOverlay', 'confirmOverlay'].forEach(closeOverlay);
  });

  fetchUsers();
}

initApp();

    </script>
</body>
</html>
