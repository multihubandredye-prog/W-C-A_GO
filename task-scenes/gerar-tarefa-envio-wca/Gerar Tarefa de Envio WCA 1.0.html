<style>
:root {
    --bg-body: #000;
    --bg-card: #06222A;
    --primary: #0F9DCB;
    --accent: #B5FB2A;
    --border: #0F507A;
    --text-main: #C6E3DC;
    --text-dim: #8494A4;
    font-size: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
}

body {
    background-color: var(--bg-body);
    color: var(--text-main);
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.content-wrapper {
    width: 92vw;
    max-width: 28rem;
    display: flex;
    flex-direction: column;
}

.main-container {
    width: 100%;
    background: var(--bg-card);
    border-radius: 1.125rem;
    border: 0.0625rem solid var(--border);
    box-shadow: 0 0.75rem 2.1875rem rgba(0,0,0,0.65);
    overflow: hidden;
}

.panel-header {
    padding: 0.875rem 1.25rem;
    background: rgba(0,0,0,0.4);
    border-bottom: 0.0625rem solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-video {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    object-fit: cover;
}

.panel-header h2 {
    font-size: 1.125rem;
    flex: 1;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.0375rem;
}

.accent-text { color: var(--accent); }

.info-container {
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-height: 60vh;
    overflow-y: auto;
}

.instrucao {
    font-size: 0.8125rem;
    color: var(--text-dim);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.05rem;
    margin-bottom: 0.25rem;
}

.btn-device {
    width: 100%;
    padding: 1rem;
    background: rgba(15, 157, 203, 0.08);
    color: var(--text-main);
    border: 0.0625rem solid var(--border);
    border-radius: 0.75rem;
    font-size: 0.9375rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.875rem;
    text-align: left;
}

.btn-device i {
    color: var(--accent);
    font-size: 1.2rem;
}

.btn-device div {
    display: flex;
    flex-direction: column;
}

.btn-device strong {
    color: #fff;
    font-size: 0.9375rem;
}

.btn-device span {
    font-size: 0.8125rem;
    color: var(--text-dim);
}

.btn-device:active {
    transform: scale(0.97);
    background: var(--border);
}

.main-footer {
    padding: 1.25rem 0;
    text-align: center;
    font-size: 0.8125rem;
    color: #aaa;
}

.dev-name {
    color: var(--accent);
    font-weight: 600;
}

.info-container::-webkit-scrollbar { width: 0.25rem; }
.info-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0.625rem; }

#statusMsg {
    text-align: center;
    padding: 1.5rem;
    color: var(--primary);
}

.position-center { justify-content: center; min-height: 100vh; }</style>

</head>
<body>

    <div class="content-wrapper position-center">

        <div class="main-container">
            <header class="panel-header">
                <video class="header-video" autoplay loop muted playsinline src="file:///storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons/video-system.mp4"></video>
                <h2><span class="accent-text">WHATS CONNECT API</span></h2>
                <video class="header-video" autoplay loop muted playsinline src="file:///storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons/video-system.mp4"></video>
            </header>

            <div class="info-container" id="dispositivosContainer">
                <div id="statusMsg">
                    <i class="fas fa-circle-notch fa-spin"></i> Sincronizando...
                </div>
            </div>
        </div>

        <footer class="main-footer">
            Desenvolvedor: <span class="dev-name">Andredye Oliveira Melo</span>
        </footer>

    </div>

<script>
// WHATS CONNECT API - Gerar Tarefa de Envio (cena V2, 1.0)
// Lista os dispositivos logados na API local e, ao escolher um numero, grava
// as variaveis de tela create_task (yes) e json (Name | Phone | FinalNumber) —
// que voltam para a tarefa que exibiu a cena quando ela e dismissada — e
// fecha a cena pela mesma cascata validada dos outros projetos. A busca usa
// a MESMA chamada do projeto original (fetch direto) e, se o acesso direto
// falhar, tenta uma vez pelo bridge (Tasker.httpRequest) antes de indicar
// servidor offline.

const WCA_SCENE_SCREEN_ID = '1'; // MESMO "ID da Tela" configurado na acao Cena v2 Mostrar
const AUTO_FECHAMENTO_DELAY_MS = 600; // pausa entre responder e fechar
const API_URL = 'http://localhost:3000/devices';
const API_HEADERS_FETCH = { 'Accept': 'application/json', 'Authorization': 'Basic dXNlcjE6cGFzczE=' };
const API_HEADERS_BRIDGE = 'Accept: application/json\nAuthorization: Basic dXNlcjE6cGFzczE=';

function getTaskerBridge(){
    if (typeof Tasker !== 'undefined') return Tasker;
    if (typeof window !== 'undefined' && window.Tasker) return window.Tasker;
    return null;
}

async function taskerCall(name, options){
    const api = getTaskerBridge();
    if (!api || typeof api[name] !== 'function') {
        throw new Error('Tasker.' + name + ' indisponivel.');
    }
    return await api[name](options);
}

function fecharPropriaCena() {
    const tentativas = [
        function () { return Tasker.dismissSceneV2(WCA_SCENE_SCREEN_ID); },
        function () { return Tasker.dismissLayout(WCA_SCENE_SCREEN_ID); },
        function () { return Tasker.cancelScreen(''); },
        function () { return Tasker.runTask({ name: '005-FECHAR_GERAR_TAREFA_ENVIO [wca]', variables: { par1: 'fechar-cena' } }).catch(function () { }); }
    ];
    for (let i = 0; i < tentativas.length; i++) {
        try { tentativas[i](); return true; } catch (eTentativa) { }
    }
    return false;
}
function agendarFechamentoProprio() {
    setTimeout(function () { fecharPropriaCena(); }, AUTO_FECHAMENTO_DELAY_MS);
}

// Procura o primeiro texto dentro da resposta do bridge (as chaves de saida
// do httpRequest nao sao documentadas; varre profundidade limitada)
function primeiroTextoProfundo(valor, profundidade, vistos){
    if (typeof valor === 'string') return valor;
    if (!valor || typeof valor !== 'object' || profundidade > 6 || vistos.has(valor)) return null;
    vistos.add(valor);
    const preferidas = ['contents', 'text', 'data', 'result', 'stdout', 'body', 'http_data', 'response', 'output', 'value'];
    for (let i = 0; i < preferidas.length; i++) {
        if (typeof valor[preferidas[i]] === 'string') return valor[preferidas[i]];
    }
    for (let i = 0; i < preferidas.length; i++) {
        if (valor[preferidas[i]] && typeof valor[preferidas[i]] === 'object') {
            const interno = primeiroTextoProfundo(valor[preferidas[i]], profundidade + 1, vistos);
            if (interno !== null) return interno;
        }
    }
    const chaves = Object.keys(valor);
    for (let i = 0; i < chaves.length; i++) {
        if (typeof valor[chaves[i]] === 'string') return valor[chaves[i]];
    }
    for (let i = 0; i < chaves.length; i++) {
        if (valor[chaves[i]] && typeof valor[chaves[i]] === 'object') {
            const interno = primeiroTextoProfundo(valor[chaves[i]], profundidade + 1, vistos);
            if (interno !== null) return interno;
        }
    }
    return null;
}

async function buscarDadosApi(){
    // 1) mesma chamada do projeto original (fetch direto no WebView)
    try {
        const resposta = await fetch(API_URL, { method: 'GET', headers: API_HEADERS_FETCH });
        if (resposta && resposta.ok) {
            const dados = JSON.parse(await resposta.text());
            if (dados && typeof dados === 'object') return dados;
        }
    } catch (eFetch) {
    }
    // 2) fallback: uma tentativa pelo bridge (caso o acesso direto falhe)
    try {
        const resultado = await Promise.race([
            taskerCall('httpRequest', { method: 'GET', url: API_URL, headers: API_HEADERS_BRIDGE, timeout: 10 }),
            new Promise(function (_, rejeitar) {
                setTimeout(function () { rejeitar(new Error('prazo da busca excedido')); }, 15000);
            })
        ]);
        const bruto = primeiroTextoProfundo(resultado, 0, new Set());
        if (bruto) {
            const dados = JSON.parse(bruto);
            if (dados && typeof dados === 'object' && dados.code) return dados;
        }
    } catch (eBridge) {
    }
    return null;
}

function escapar(texto){
    return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

async function buscarDispositivos() {
    const container = document.getElementById('dispositivosContainer');
    if (!container) return;
    const dados = await buscarDadosApi();
    if (!dados) {
        container.innerHTML = "<div id='statusMsg'>Servidor Offline.</div>";
        return;
    }
    if (dados.code === 'SUCCESS') {
        const logados = (dados.results || []).filter(function (dev) { return dev && dev.state === 'logged_in'; });
        renderizarBotoes(logados);
    } else {
        container.innerHTML = "<div id='statusMsg'>Erro na API.</div>";
    }
}

function renderizarBotoes(lista) {
    const container = document.getElementById('dispositivosContainer');
    container.innerHTML = '';

    if (!lista || lista.length === 0) {
        container.innerHTML = "<div id='statusMsg'>Nenhum dispositivo logado.</div>";
        return;
    }

    const p = document.createElement('p');
    p.className = 'instrucao';
    p.innerText = 'Selecione o número que deseja utilizar para gerar a tarefa:';
    container.appendChild(p);

    lista.forEach(function (dev) {
        const numeroCompleto = String(dev.jid || '').split('@')[0];
        const ultimosQuatro = numeroCompleto.slice(-4);
        const nome = dev.display_name || 'WhatsApp';

        const btn = document.createElement('button');
        btn.className = 'btn-device';
        btn.innerHTML =
            '<i class="fab fa-whatsapp"></i>' +
            '<div>' +
            '<strong>' + escapar(nome) + '</strong>' +
            '<span>' + escapar(numeroCompleto) + '</span>' +
            '</div>';

        btn.addEventListener('click', function () {
            taskCriarTarefa(nome, numeroCompleto, ultimosQuatro);
        });

        container.appendChild(btn);
    });
}

// ---- AMBIENTE DO TASKER ----
// Unica saida: o dispositivo escolhido grava as variaveis de tela
// create_task = yes e json = { Name, Phone, FinalNumber } (mesmo formato do
// projeto original, com indentacao de 4) e fecha a cena; resposta dupla e
// ignorada (guarda interna)
let _respondido = false;
async function taskCriarTarefa(nome, numero, final){
    if (_respondido) return;
    _respondido = true;
    const resultado = {
        Name: nome,
        Phone: numero,
        FinalNumber: final
    };
    const json = JSON.stringify(resultado, null, 4);
    try {
        const api = getTaskerBridge();
        if (api && typeof api.setVariable === 'function') {
            await api.setVariable('create_task', 'yes');
            await api.setVariable('json', json);
        }
    } catch (eSet) {
    }
    agendarFechamentoProprio();
}

document.addEventListener('DOMContentLoaded', function () {
    buscarDispositivos();
});
</script>
