<html lang="pt-BR">

    <style>
:root {
  --bg-body: #000000;
  --bg-card: #06222A;
  --primary: #0F9DCB;
  --accent: #B5FB2A;
  --border: #0F507A;
  --text-main: #C6E3DC;
  --danger: #FF5A67;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
}

body {
  background-color: var(--bg-body);
  color: var(--text-main);
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  margin: 0;
}

.main-wrapper {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  width: 100vw;
  padding: 1rem;
  gap: 1.5rem;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0, 0, 0, 0.4);
  border: 0.0625rem solid var(--border);
  border-radius: 1rem;
  padding: 0.75rem 1rem;
  width: 100%;
  max-width: 40rem;
  box-shadow: 0 0.75rem 2.25rem rgba(0, 0, 0, 0.6);
}

@media (min-width: 30rem) {
  .panel-header {
    padding: 0.75rem 1.5rem;
  }
}

.header-video {
  width: 3rem;
  height: 3rem;
  border-radius: 50vw;
  object-fit: cover;
  background-color: var(--bg-card);
  border: 0.125rem solid var(--border);
  flex-shrink: 0;
}

h2 {
  margin: 0;
  padding: 0 0.5rem;
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
}

.accent-text {
  color: var(--accent);
  font-weight: 800;
  letter-spacing: 0.08em;
  text-shadow: 0 0 0.75rem rgba(181, 251, 42, 0.25);
  font-size: 1.125rem;
  text-align: center;
}

@media (min-width: 30rem) {
  .accent-text {
    font-size: 1.5rem;
  }
}

.update-card, .no-update-card {
  background-color: var(--bg-card);
  border: 0.0625rem solid var(--border);
  border-radius: 1rem;
  padding: 1.5rem;
  box-shadow: 0 0.75rem 2.25rem rgba(0, 0, 0, 0.6);
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 40rem;
  display: none;
}

.no-update-card {
  text-align: center;
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--text-main);

.update-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0.25rem;

.card-header-row {

  justify-content: center;

@keyframes badge-glow {
  0% { box-shadow: 0 0 0 0 rgba(181, 251, 42, 0.5); transform: scale(1); }
  50% { box-shadow: 0 0 1rem 0.25rem rgba(181, 251, 42, 0.25); transform: scale(1.02); }
  100% { box-shadow: 0 0 0 0 rgba(181, 251, 42, 0); transform: scale(1); }
}

.badge {
  display: inline-block;
  background: rgba(181, 251, 42, 0.15);
  color: var(--accent);
  border: 0.0625rem solid var(--accent);
  padding: 0.5rem 1rem;
  border-radius: 1.25rem;
  font-size: 0.875rem;
  font-weight: 800;
  letter-spacing: 0.05em;

}

.action-row {
  display: flex;
  justify-content: flex-end;
  border-t: 0.0625rem solid var(--border);
  padding-top: 1.25rem;
}

.btn-now {
  background-color: var(--accent);
  color: #000000;
  font-weight: 800;
  padding: 0.875rem 2rem;
  border-radius: 0.625rem;
  border: none;
  cursor: pointer;
  font-size: 0.9375rem;
  transition: all 0.2s ease;
  width: 100%;
}

@media (min-width: 30rem) {
  .btn-now {
    width: auto;
  }
}

.btn-now:active {
  filter: brightness(1.1);
  box-shadow: 0 0 1.125rem rgba(181, 251, 42, 0.4);
}

.changelog-section {
  background: rgba(0, 0, 0, 0.4);
  border: 0.0625rem solid var(--border);
  border-radius: 0.75rem;
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background-color 0.2s ease;
}

.changelog-section:active {
  background: rgba(0, 0, 0, 0.6);
}

.changelog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
  cursor: pointer;
  user-select: none;
}

.changelog-title {
  color: #ffffff;
  font-size: 0.9375rem;
  font-weight: 700;
  margin: 0;
}

.chevron-icon {
  width: 1.25rem;
  height: 1.25rem;
  color: var(--primary);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.chevron-icon.rotated {
  transform: rotate(180deg);
}

.changelog-content {
  color: var(--text-main);
  font-size: 0.875rem;
  line-height: 1.5;
  max-height: 5.25rem;
  opacity: 1;
  overflow: hidden;
  padding: 0 1rem 1rem 1rem;
  white-space: pre-wrap;
  word-break: break-word;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
}

.changelog-content.expanded {
  max-height: 20rem;
  overflow-y: auto;
  mask-image: none;
  -webkit-mask-image: none;
}

.changelog-content::-webkit-scrollbar {
  width: 0.375rem;
}

.changelog-content::-webkit-scrollbar-track {
  background: transparent;
}

.changelog-content::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 0.25rem;
}

.update-status { display: none; margin: 1rem 0 0; padding: 1rem 1.2rem; border: 0.1rem solid var(--border); border-radius: 0.75rem; background: rgba(0,0,0,0.38); color: var(--text-main); font-size: 1rem; line-height: 1.45; text-align: center; }
.update-status.show { display: block; }
.update-status.error { border-color: var(--danger); color: var(--danger); }
.update-status.success { border-color: var(--accent); color: var(--accent); }
.update-progress { display: flex; align-items: center; justify-content: center; gap: 0.65rem; margin-top: 0.75rem; }
.update-counter { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent); color: #000; font-weight: 800; box-shadow: 0 0 0.75rem rgba(181,251,42,0.4); }
.btn-now:disabled { opacity: 0.58; transform: none; box-shadow: none; }
.download-file-name { display: block; margin-bottom: 0.55rem; color: var(--text-main); font-weight: 700; overflow-wrap: anywhere; }
.download-progress { display: block; width: 100%; height: 0.8rem; margin: 0.45rem 0; border: 0; border-radius: 999px; overflow: hidden; accent-color: var(--accent); background: rgba(255,255,255,0.1); }
.download-progress::-webkit-progress-bar { background: rgba(255,255,255,0.1); border-radius: 999px; }
.download-progress::-webkit-progress-value { background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 999px; }
.download-progress-text { display: block; color: var(--text-main); font-size: 0.9rem; }
</style>

    <script>
// WHATS CONNECT API - Painel de Atualizacoes (cena V2, 1.11)
// A cena identifica a release real mais recente e executa a atualizacao sem
// encaminhar para a cena de instalacao. CORE substitui os dois binarios; UI
// baixa o projeto Tasker; FULL executa as duas etapas. Projeto e FULL publicam
// type_project como project-task antes do encerramento da propria cena.

const VERSION_FILE_PATH = '/storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/system/version';
const RELEASES_API_URL = 'https://api.github.com/repos/multihubandredye-prog/W-C-A_GO/releases?per_page=30';
// 1.2: as novidades usam a API do GitHub como PRIMEIRA fonte (mesmo dominio
// das releases, que ja responde no aparelho); o caminho da V1 no
// raw.githubusercontent.com fica de FALLBACK (no aparelho ele falhou mesmo
// com o arquivo existindo no repositorio)
const CHANGELOG_FONTES = [
    { url: 'https://api.github.com/repos/multihubandredye-prog/W-C-A_GO/contents/wca-resources/updates/changelog.txt', opcoes: { headers: { 'Accept': 'application/vnd.github.raw' } } },
    { url: 'https://raw.githubusercontent.com/multihubandredye-prog/W-C-A_GO/main/wca-resources/updates/changelog.txt', opcoes: { } }
];const BIN_DIR = '/data/data/net.dinglisch.android.taskerm/files/WCA';
const PROJECT_FILE_PATH = '/storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/system/tasks-send/W_C_A_API.prj.xml';
const PASTA_WEBVIEW = '/storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/web-view';
const PASTA_ICONS = '/storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons';
const PASTA_STAGE_ZIP = PASTA_WEBVIEW + '/.wca-package-stage';
const CAMINHO_ZIP = PASTA_WEBVIEW + '/.wca-package-update.zip';
const PREFIXO_ZIP = 'WCA-Tasker-Projetos-';
const UPDATE_FILES = {
    whatsapp: { name: 'whatsapp-wca-aarch64.bin', path: BIN_DIR + '/whatsapp-wca-aarch64.bin' },
    ffmpeg: { name: 'ffmpeg-wca-aarch64.bin', path: BIN_DIR + '/ffmpeg-wca-aarch64.bin' },
    project: { name: 'W_C_A_API.prj.xml', path: PROJECT_FILE_PATH }
};
const UPDATE_TASK_NAME = '005-CONFIGURAR_SISTEMA [wca]';
const WCA_SCENE_SCREEN_ID = '1';
const COUNTDOWN_SECONDS = 10;
const PADRAO_TITULO_RELEASE = /\[\s*(ui|core|full)\s*\]/i;

let versaoLocal = '';
let currentUpdateType = '';
let currentUpdateVersion = '';
let currentReleaseAssets = {};
let updateRunning = false;
let closeTimer = null;
let continuationStarted = false;

function getTaskerBridge(){
    if (typeof Tasker !== 'undefined') return Tasker;
    if (typeof window !== 'undefined' && window.Tasker) return window.Tasker;
    return null;
}

async function taskerCall(name, options){
    const api = getTaskerBridge();
    if (!api || typeof api[name] !== 'function') {
        throw new Error('Tasker.' + name + ' indisponivel. Verifique Allow Phone Access.');
    }
    return await api[name](options);
}

function bridgeTimeout(ms){
    return new Promise(function(resolve){ setTimeout(resolve, ms); });
}

function unpackFile(result, depth = 0, seen = new Set()){
    if (typeof result === 'string') return result;
    if (!result || typeof result !== 'object' || depth > 6 || seen.has(result)) return null;
    seen.add(result);
    const preferidas = ['contents', 'text', 'content', 'file', 'stdout', 'output', 'data', 'result', 'variables', 'payload', 'returnValue', 'value'];
    for (const chave of preferidas) {
        if (typeof result[chave] === 'string') return result[chave];
    }
    for (const chave of preferidas) {
        if (result[chave] && typeof result[chave] === 'object') {
            const interno = unpackFile(result[chave], depth + 1, seen);
            if (interno !== null) return interno;
        }
    }
    return null;
}

function shellQuote(value){
    return "'" + String(value).replace(/'/g, "'\\''") + "'";
}

function isMissingFileError(error){
    const detalhes = [error && error.message, error && error.code, error && error.name, error && error.cause && error.cause.message]
        .filter(Boolean).join(' ').toLowerCase();
    return /enoent|no such file|file not found|does not exist|not found|cannot find|could not find|arquivo.{0,40}(não existe|nao existe|não encontrado|nao encontrado)/i.test(detalhes);
}

async function readTextWithShell(path){
    const quotedPath = shellQuote(path);
    const directory = path.slice(0, path.lastIndexOf('/')) || '/';
    const quotedDirectory = shellQuote(directory);
    const marker = '__WCA_FILE__\n';
    const missing = '__WCA_MISSING__';
    const command = "if [ -f " + quotedPath + " ]; then printf '__WCA_FILE__\\n'; cat -- " + quotedPath + " || exit 13; elif [ -e " + quotedPath + " ]; then exit 14; elif [ -d " + quotedDirectory + " ] && [ -r " + quotedDirectory + " ] && [ -x " + quotedDirectory + " ]; then printf '__WCA_MISSING__'; else exit 15; fi";
    const result = await taskerCall('runShell', { cmd: command, root: false, timeout: 10 });
    if (!result || typeof result.stdout !== 'string' || (result.result !== undefined && result.result !== '' && Number(result.result) !== 0)) {
        throw new Error('Tasker.runShell nao conseguiu ler o arquivo.');
    }
    if (result.stdout.trim() === missing) return { missing: true, contents: '' };
    if (!result.stdout.startsWith(marker)) throw new Error('A leitura alternativa nao confirmou o conteudo do arquivo.');
    return { missing: false, contents: result.stdout.slice(marker.length) };
}

async function lerArquivo(path, regexValidacao){
    let result = null;
    try {
        result = await taskerCall('readFile', { path });
        const texto = unpackFile(result);
        if (texto !== null && (!regexValidacao || regexValidacao.test(texto))) return texto;
    } catch (e) {
        if (isMissingFileError(e)) return '';
    }
    try {
        const alternativa = await readTextWithShell(path);
        if (alternativa.missing) return '';
        return alternativa.contents;
    } catch (e2) {
        return '';
    }
}

// Versao local: leitura do ARQUIVO (fire-and-forget com prazo de 15s, igual a
// Central). Vazia/ausente = base de comparacao vazia (comportamento da V1
// quando a variavel antiga chegava vazia)
async function lerVersaoLocal(){
    try {
        const texto = await Promise.race([ lerArquivo(VERSION_FILE_PATH, /^\d[\d.]*$/), bridgeTimeout(15000) ]);
        versaoLocal = String(texto || '').trim();
    } catch (e) {
        versaoLocal = '';
    }
    return versaoLocal;
}

function isNewVersionAvailable(remoteTag, localTag){
    const cleanRemote = remoteTag.replace(/^v/i, '').trim();
    const cleanLocal = localTag.replace(/^v/i, '').trim();
    if (!cleanRemote || cleanRemote === cleanLocal) {
        return false;
    }
    const remoteParts = cleanRemote.split('.').map(function (num) {
        return parseInt(num, 10) || 0;
    });
    const localParts = cleanLocal.split('.').map(function (num) {
        return parseInt(num, 10) || 0;
    });
    const maxLen = Math.max(remoteParts.length, localParts.length);
    for (let i = 0; i < maxLen; i++) {
        const r = remoteParts[i] || 0;
        const l = localParts[i] || 0;
        if (r > l) {
            return true;
        }
        if (r < l) {
            return false;
        }
    }
    return false;
}

// Ultima release REAL do repositorio: primeira da lista (mais recente) cujo
// titulo tem o rotulo entre colchetes; o tipo (ui | core | full) sai do
// proprio rotulo, ja em minusculas
async function obterUltimaReleaseReal(){
    try {
        const resposta = await fetch(RELEASES_API_URL, { headers: { 'User-Agent': 'WCA-Panel', 'Accept': 'application/vnd.github+json' } });
        if (!resposta || !resposta.ok) return null;
        const lista = await resposta.json();
        if (!Array.isArray(lista)) return null;
        for (let i = 0; i < lista.length; i++) {
            const titulo = String((lista[i] && lista[i].name) || '');
            const correspondencia = titulo.match(PADRAO_TITULO_RELEASE);
            if (!correspondencia) continue;
            const tag = String((lista[i] && lista[i].tag_name) || '').trim().replace(/^[vV]/, '').trim();
            if (!/^\d[\d.]*$/.test(tag)) continue;
            const assets = {};
            const listaAssets = Array.isArray(lista[i].assets) ? lista[i].assets : [];
            for (let a = 0; a < listaAssets.length; a++) {
                const item = listaAssets[a] || {};
                const nomeAsset = String(item.name || '');
                if (nomeAsset) assets[nomeAsset] = { url: String(item.browser_download_url || ''), size: Number(item.size || 0) };
            }
            return { tag: tag, tipo: correspondencia[1].toLowerCase(), assets: assets };
        }
    } catch (e) {
    }
    return null;
}

async function fetchChangelogData(){
    const contentElement = document.getElementById('changelogContent');
    if (!contentElement) return;
    for (let i = 0; i < CHANGELOG_FONTES.length; i++) {
        try {
            const resposta = await fetch(CHANGELOG_FONTES[i].url, CHANGELOG_FONTES[i].opcoes);
            if (!resposta || !resposta.ok) continue;
            const texto = await resposta.text();
            if (String(texto || '').trim() === '') continue;
            contentElement.textContent = texto;
            return;
        } catch (eFonte) { }
    }
    contentElement.textContent = 'Não foi possível carregar as novidades.';
}

function textoBadgeParaTipo(tipo, tag){
    if (tipo === 'core') return 'ATUALIZAÇÃO DA API • ' + tag;
    if (tipo === 'ui') return 'ATUALIZAÇÃO DO TASKER • ' + tag;
    return 'ATUALIZAÇÃO COMPLETA • ' + tag;
}

async function checkReleaseUpdate(versionBadge, updateCard, noUpdateCard){
    const release = await obterUltimaReleaseReal();
    const temNova = !!(release && release.tag && isNewVersionAvailable(release.tag, versaoLocal));
    if (temNova) {
        currentUpdateType = release.tipo;
        currentUpdateVersion = release.tag;
        currentReleaseAssets = release.assets || {};
        if (versionBadge) versionBadge.textContent = textoBadgeParaTipo(currentUpdateType, currentUpdateVersion);
        fetchChangelogData();
        if (updateCard) updateCard.style.display = 'block';
        if (noUpdateCard) noUpdateCard.style.display = 'none';
    } else {
        currentUpdateType = '';
        currentUpdateVersion = '';
        currentReleaseAssets = {};
        if (updateCard) updateCard.style.display = 'none';
        if (noUpdateCard) noUpdateCard.style.display = 'block';
    }
}

// ---- ATUALIZACAO DIRETA ----
function parentPath(path){
    return path.slice(0, path.lastIndexOf('/')) || '/';
}

function assetDaRelease(nome){
    const asset = currentReleaseAssets[nome];
    if (!asset || !asset.url) throw new Error('A release nao possui o arquivo ' + nome + '.');
    return asset;
}

async function executarShellSeguro(cmd, timeout){
    const resultado = await taskerCall('runShell', { cmd: cmd, root: false, timeout: timeout || 60 });
    const codigo = resultado && resultado.result !== undefined && resultado.result !== '' ? Number(resultado.result) : 0;
    if (!resultado || codigo !== 0) throw new Error('Falha ao preparar o arquivo no armazenamento.');
    return resultado;
}

function formatarBytes(bytes){
    const valor = Math.max(0, Number(bytes || 0));
    if (valor >= 1048576) return (valor / 1048576).toFixed(1).replace('.', ',') + ' MB';
    if (valor >= 1024) return (valor / 1024).toFixed(1).replace('.', ',') + ' KB';
    return String(Math.floor(valor)) + ' B';
}

function mostrarProgressoDownload(nome, baixado, total, indice, quantidade){
    const status = document.getElementById('updateStatus');
    if (!status) return;
    const atual = Math.max(0, Number(baixado || 0));
    const maximo = Math.max(0, Number(total || 0));
    const progresso = maximo > 0 ? Math.max(0, Math.min(100, Math.floor(atual * 100 / maximo))) : 0;
    const atributoValor = maximo > 0 ? ' value="' + String(progresso) + '"' : '';
    const medida = maximo > 0 ? formatarBytes(atual) + ' de ' + formatarBytes(maximo) + ' • ' + String(progresso) + ' de 100' : formatarBytes(atual);
    status.className = 'update-status show';
    status.innerHTML = '<span class="download-file-name">Arquivo ' + String(indice) + ' de ' + String(quantidade) + ': ' + nome + '</span><progress class="download-progress" max="100"' + atributoValor + '></progress><span class="download-progress-text">' + medida + '</span>';
}

async function tamanhoArquivoTemporario(path){
    try {
        const resultado = await taskerCall('runShell', {
            cmd: 'if [ -f ' + shellQuote(path) + ' ]; then wc -c < ' + shellQuote(path) + "; else printf '0'; fi",
            root: false,
            timeout: 20
        });
        const tamanho = Number(String((resultado && resultado.stdout) || '0').trim());
        return Number.isFinite(tamanho) && tamanho > 0 ? tamanho : 0;
    } catch (eTamanho) {
        return 0;
    }
}

async function acompanharDownload(promessa, temporario, nome, total, indice, quantidade){
    let finalizado = false;
    let erroDownload = null;
    const controlada = Promise.resolve(promessa).then(function () {
        finalizado = true;
    }).catch(function (erro) {
        erroDownload = erro;
        finalizado = true;
    });
    mostrarProgressoDownload(nome, 0, total, indice, quantidade);
    while (!finalizado) {
        await bridgeTimeout(450);
        const tamanho = await tamanhoArquivoTemporario(temporario);
        mostrarProgressoDownload(nome, tamanho, total, indice, quantidade);
    }
    await controlada;
    if (erroDownload) throw erroDownload;
    const tamanhoFinal = await tamanhoArquivoTemporario(temporario);
    mostrarProgressoDownload(nome, tamanhoFinal, total, indice, quantidade);
}

async function baixarArquivoAtomico(nomeAsset, destino, executavel, indice, quantidade){
    const asset = assetDaRelease(nomeAsset);
    const temporario = destino + '.update';
    const pasta = parentPath(destino);
    await executarShellSeguro('mkdir -p ' + shellQuote(pasta) + ' && rm -f ' + shellQuote(temporario), 30);
    try {
        const requisicao = taskerCall('httpRequest', {
            method: 'GET',
            url: asset.url,
            headers: 'User-Agent: Tasker\nAccept: application/octet-stream',
            fileToSave: temporario,
            timeout: 600,
            autoRedirect: true
        });
        await acompanharDownload(requisicao, temporario, nomeAsset, asset.size, indice, quantidade);
        let validar = 'test -s ' + shellQuote(temporario);
        if (asset.size > 0) validar += ' && test "$(wc -c < ' + shellQuote(temporario) + ')" -eq ' + String(Math.floor(asset.size));
        if (!executavel) validar += " && grep -q '<TaskerData' " + shellQuote(temporario);
        validar += ' && mv -f ' + shellQuote(temporario) + ' ' + shellQuote(destino);
        if (executavel) validar += ' && chmod 700 ' + shellQuote(destino);
        await executarShellSeguro(validar, 120);
    } catch (erroDownload) {
        try { await executarShellSeguro('rm -f ' + shellQuote(temporario), 20); } catch (eLimpeza) { }
        throw erroDownload;
    }
}

// O pacote deve pertencer a release selecionada, nunca a outra versao.
function nomePacoteDaRelease(){
    const nomes = [PREFIXO_ZIP + currentUpdateVersion + '.zip', PREFIXO_ZIP + 'v' + currentUpdateVersion + '.zip', PREFIXO_ZIP + 'V' + currentUpdateVersion + '.zip'];
    for (let i = 0; i < nomes.length; i++) {
        if (currentReleaseAssets[nomes[i]] && currentReleaseAssets[nomes[i]].url) return nomes[i];
    }
    throw new Error('A release selecionada não contém o pacote ZIP de cenas e mídias.');
}

async function executarShellConfirmado(cmd, timeout){
    const resultado = await taskerCall('runShell', { cmd: cmd + " && printf 'WCA_ZIP_OK'", root: false, timeout: timeout || 60 });
    if (!resultado || String(resultado.stdout || '').indexOf('WCA_ZIP_OK') < 0) throw new Error('Falha ao preparar ou gravar o pacote de cenas.');
}

async function baixarPacoteZip(nome, indice, quantidade){
    const asset = assetDaRelease(nome);
    const parcial = CAMINHO_ZIP + '.update';
    await executarShellConfirmado('mkdir -p ' + shellQuote(PASTA_WEBVIEW) + ' && rm -f ' + shellQuote(parcial), 30);
    try {
        const requisicao = taskerCall('httpRequest', { method: 'GET', url: asset.url, headers: 'User-Agent: Tasker\nAccept: application/octet-stream', fileToSave: parcial, timeout: 600, autoRedirect: true });
        await acompanharDownload(requisicao, parcial, nome, asset.size, indice, quantidade);
        let validar = 'test -s ' + shellQuote(parcial);
        if (asset.size > 0) validar += ' && test "$(wc -c < ' + shellQuote(parcial) + ')" -eq ' + String(Math.floor(asset.size));
        await executarShellConfirmado(validar + ' && mv -f ' + shellQuote(parcial) + ' ' + shellQuote(CAMINHO_ZIP), 60);
    } catch (eDownload) {
        try { await executarShellSeguro('rm -f ' + shellQuote(parcial), 20); } catch (eLimpeza) { }
        throw eDownload;
    }
}

async function lerPacoteZip(){
    const resultado = await taskerCall('runShell', { cmd: 'base64 ' + shellQuote(CAMINHO_ZIP), root: false, timeout: 120 });
    const base64 = String(resultado && resultado.stdout || '').replace(/\s+/g, '');
    if (!base64) throw new Error('Não foi possível ler o pacote ZIP baixado.');
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    return bytes;
}

function crcPacote(bytes){
    let crc = 4294967295;
    for (let i = 0; i < bytes.length; i++) {
        crc = crc ^ bytes[i];
        for (let bit = 0; bit < 8; bit++) crc = (crc & 1) ? (crc >>> 1) ^ 3988292384 : crc >>> 1;
    }
    return (crc ^ 4294967295) >>> 0;
}

// Analisa diretorio central e valida caminhos e limites antes de gravar arquivos.
function entradasPacote(bytes){
    if (!bytes || bytes.length < 22) throw new Error('Pacote ZIP inválido.');
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let fim = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (dv.getUint32(i, true) === 101010256 && i + 22 + dv.getUint16(i + 20, true) === bytes.length) { fim = i; break; }
    }
    if (fim < 0) throw new Error('Diretório do ZIP não encontrado.');
    const total = dv.getUint16(fim + 10, true);
    const tamanhoDiretorio = dv.getUint32(fim + 12, true);
    const inicioDiretorio = dv.getUint32(fim + 16, true);
    if (dv.getUint16(fim + 4, true) || dv.getUint16(fim + 6, true) || dv.getUint16(fim + 8, true) !== total || total === 65535 || inicioDiretorio + tamanhoDiretorio !== fim) throw new Error('Formato ZIP não suportado.');
    let pos = inicioDiretorio;
    const saida = [];
    const nomes = new Set();
    for (let i = 0; i < total; i++) {
        if (pos + 46 > fim || dv.getUint32(pos, true) !== 33639248) throw new Error('Diretório ZIP inválido.');
        const flags = dv.getUint16(pos + 8, true), metodo = dv.getUint16(pos + 10, true);
        const crc = dv.getUint32(pos + 16, true), compactado = dv.getUint32(pos + 20, true), tamanho = dv.getUint32(pos + 24, true);
        const nomeLen = dv.getUint16(pos + 28, true), extraLen = dv.getUint16(pos + 30, true), comentarioLen = dv.getUint16(pos + 32, true), local = dv.getUint32(pos + 42, true);
        if (pos + 46 + nomeLen + extraLen + comentarioLen > fim || (flags & 1) || (metodo !== 0 && metodo !== 8) || compactado === 4294967295 || tamanho === 4294967295) throw new Error('Entrada ZIP não suportada.');
        const nome = new TextDecoder('utf-8', { fatal: true }).decode(bytes.subarray(pos + 46, pos + 46 + nomeLen));
        pos += 46 + nomeLen + extraLen + comentarioLen;
        if (!nome || nome.charAt(0) === '/' || nome.indexOf('\\') >= 0 || nome.indexOf('\0') >= 0) throw new Error('Caminho inseguro no ZIP.');
        const partes = nome.split('/');
        if (partes.some(function (parte) { return parte === '..' || parte === '.'; })) throw new Error('Caminho inseguro no ZIP.');
        if (nome.endsWith('/')) continue;
        if (partes.some(function (parte) { return !parte; })) throw new Error('Caminho inválido no ZIP.');
        let destino, relativo;
        if (nome.indexOf('task-scenes/') === 0) { destino = PASTA_WEBVIEW; relativo = nome; }
        else if (nome.indexOf('icons/') === 0) { destino = PASTA_ICONS; relativo = nome.slice(6); }
        else throw new Error('O ZIP contém uma pasta não reconhecida.');
        if (!relativo || nomes.has(destino + '/' + relativo)) throw new Error('Arquivo duplicado no ZIP.');
        nomes.add(destino + '/' + relativo);
        if (local + 30 > inicioDiretorio || dv.getUint32(local, true) !== 67324752 || dv.getUint16(local + 8, true) !== metodo) throw new Error('Cabeçalho ZIP inválido.');
        const inicio = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
        if (inicio > inicioDiretorio || compactado > inicioDiretorio - inicio) throw new Error('Dados ZIP incompletos.');
        saida.push({ destino: destino + '/' + relativo, etapa: PASTA_STAGE_ZIP + '/arquivo-' + String(saida.length), metodo: metodo, tamanho: tamanho, crc: crc, dados: bytes.subarray(inicio, inicio + compactado) });
    }
    if (pos !== fim || !saida.length) throw new Error('Pacote ZIP vazio ou inválido.');
    const destinos = saida.map(function (item) { return item.destino; }).sort();
    for (let i = 1; i < destinos.length; i++) {
        if (destinos[i].indexOf(destinos[i - 1] + '/') === 0) throw new Error('Arquivos conflitantes no ZIP.');
    }
    return saida;
}

async function validarConteudoPacote(entradas){
    for (let i = 0; i < entradas.length; i++) {
        const item = entradas[i];
        let dados = item.dados;
        if (item.metodo === 8) {
            if (typeof DecompressionStream === 'undefined') throw new Error('Este WebView não suporta a compressão do pacote.');
            const fluxo = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            dados = new Uint8Array(await new Response(fluxo).arrayBuffer());
        }
        if (dados.length !== item.tamanho || crcPacote(dados) !== item.crc) throw new Error('Arquivo do pacote ZIP corrompido.');
        item.dados = dados;
    }
}

function pacoteBase64(bytes){
    let binario = '';
    for (let i = 0; i < bytes.length; i += 8192) binario += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(binario);
}

async function extrairPacoteZip(){
    mostrarStatus('Verificando o pacote de cenas e mídias...', '');
    const entradas = entradasPacote(await lerPacoteZip());
    await validarConteudoPacote(entradas);
    await executarShellConfirmado('rm -rf ' + shellQuote(PASTA_STAGE_ZIP) + ' && mkdir -p ' + shellQuote(PASTA_STAGE_ZIP), 60);
    try {
        // Primeiro prepara todos os arquivos; somente depois substitui destinos.
        for (let i = 0; i < entradas.length; i++) {
            const item = entradas[i];
            mostrarStatus('Preparando arquivo ' + (i + 1) + ' de ' + entradas.length + '...', '');
            await executarShellConfirmado('mkdir -p ' + shellQuote(parentPath(item.etapa)), 30);
            const base64Path = item.etapa + '.b64';
            const resultado = await taskerCall('writeFile', { path: base64Path, text: pacoteBase64(item.dados), append: false });
            if (resultado === false || resultado === 'false' || resultado && (resultado.ok === false || resultado.success === false || resultado.result === false)) throw new Error('Não foi possível preparar o arquivo do pacote.');
            await executarShellConfirmado('base64 -d ' + shellQuote(base64Path) + ' > ' + shellQuote(item.etapa) + ' && rm -f ' + shellQuote(base64Path) + ' && test "$(wc -c < ' + shellQuote(item.etapa) + ')" -eq ' + item.tamanho, 90);
        }
        for (let i = 0; i < entradas.length; i++) {
            const item = entradas[i];
            mostrarStatus('Atualizando cenas e mídias: ' + (i + 1) + ' de ' + entradas.length + '...', '');
            await executarShellConfirmado('mkdir -p ' + shellQuote(parentPath(item.destino)) + ' && mv -f ' + shellQuote(item.etapa) + ' ' + shellQuote(item.destino), 60);
        }
    } finally {
        try { await executarShellSeguro('rm -rf ' + shellQuote(PASTA_STAGE_ZIP), 60); } catch (eLimpeza) { }
    }
    await executarShellConfirmado('rm -f ' + shellQuote(CAMINHO_ZIP), 30);
}

async function atualizarCenasEMidias(nome, indice, quantidade){
    await baixarPacoteZip(nome, indice, quantidade);
    await extrairPacoteZip();
}

function mostrarStatus(texto, classe){
    const status = document.getElementById('updateStatus');
    if (!status) return;
    status.className = 'update-status show' + (classe ? ' ' + classe : '');
    status.textContent = texto;
}

async function fecharPropriaCena(){
    if (closeTimer !== null) {
        clearInterval(closeTimer);
        closeTimer = null;
    }
    const api = getTaskerBridge();
    if (!api) return false;
    const tentativas = [
        function () { return api.dismissSceneV2(WCA_SCENE_SCREEN_ID); },
        function () { return api.dismissLayout(WCA_SCENE_SCREEN_ID); },
        function () { return api.cancelScreen(''); }
    ];
    let algumOk = false;
    for (let i = 0; i < tentativas.length; i++) {
        try { tentativas[i](); algumOk = true; } catch (eFechar) { }
    }
    return algumOk;
}

async function continuarFluxoAtualizacao(typeProject){
    if (continuationStarted) return;
    continuationStarted = true;
    if (closeTimer !== null) {
        clearInterval(closeTimer);
        closeTimer = null;
    }
    const botao = document.getElementById('updateNowButton');
    if (botao) {
        botao.disabled = true;
        botao.textContent = 'CONTINUANDO...';
    }
    try {
        const api = getTaskerBridge();
        if (!api || typeof api.setVariable !== 'function') throw new Error('Tasker.setVariable indisponível.');
        await api.setVariable('type_project', typeProject);
        const chamada = dispararConfiguracao(typeProject);
        let falhaDisparo = null;
        const protegida = Promise.resolve(chamada).catch(function (erro) { falhaDisparo = erro; });
        await Promise.race([protegida, bridgeTimeout(1200)]);
        if (falhaDisparo) throw falhaDisparo;
        fecharPropriaCena();
    } catch (erroFluxo) {
        continuationStarted = false;
        mostrarStatus('Não foi possível continuar: ' + String((erroFluxo && erroFluxo.message) || erroFluxo), 'error');
        if (botao) {
            botao.disabled = false;
            botao.textContent = typeProject === 'project-api' ? 'ATUALIZAR AGORA' : 'INSTALAR AGORA';
            botao.onclick = function () { continuarFluxoAtualizacao(typeProject); };
        }
    }
}

function iniciarContagemFinal(precisaProjeto, typeProject){
    continuationStarted = false;
    let restante = COUNTDOWN_SECONDS;
    const status = document.getElementById('updateStatus');
    const botao = document.getElementById('updateNowButton');
    function desenhar(){
        if (!status) return;
        status.className = 'update-status show success';
        status.innerHTML = '<strong>Atualização concluída.</strong><div class="update-progress"><span>' + (precisaProjeto ? 'Iniciando a instalação do projeto' : 'Continuando a atualização do sistema') + '</span><span class="update-counter">' + String(restante) + '</span></div>';
    }
    if (botao) {
        botao.disabled = false;
        botao.textContent = precisaProjeto ? 'INSTALAR AGORA' : 'ATUALIZAR AGORA';
        botao.onclick = function () { continuarFluxoAtualizacao(typeProject); };
    }
    desenhar();
    closeTimer = setInterval(function () {
        restante -= 1;
        if (restante <= 0) continuarFluxoAtualizacao(typeProject);
        else desenhar();
    }, 1000);
}

function typeProjectParaAtualizacao(tipo){
    if (tipo === 'core') return 'project-api';
    if (tipo === 'full') return 'project-full';
    if (tipo === 'ui' || tipo === 'project') return 'project-task';
    return '';
}

function dispararConfiguracao(typeProject){
    return taskerCall('runTask', {
        name: UPDATE_TASK_NAME,
        variables: { par1: 'installation-update', type_project: typeProject }
    });
}

async function executarAtualizacao(tipo){
    if (updateRunning) return;
    updateRunning = true;
    const botao = document.getElementById('updateNowButton');
    if (botao) {
        botao.disabled = true;
        botao.textContent = 'ATUALIZANDO...';
    }
    try {
        const atualizarCore = tipo === 'core' || tipo === 'full';
        const atualizarProjeto = tipo === 'ui' || tipo === 'project' || tipo === 'full';
        if (!atualizarCore && !atualizarProjeto) throw new Error('Tipo de atualização desconhecido.');
        // Antes de alterar arquivos, verifica todos os assets exigidos da release.
        const nomeZip = nomePacoteDaRelease();
        assetDaRelease(nomeZip);
        if (atualizarCore) { assetDaRelease(UPDATE_FILES.whatsapp.name); assetDaRelease(UPDATE_FILES.ffmpeg.name); }
        if (atualizarProjeto) assetDaRelease(UPDATE_FILES.project.name);
        const quantidadeArquivos = (atualizarCore && atualizarProjeto ? 3 : (atualizarCore ? 2 : 1)) + 1;
        let indiceArquivo = 1;
        await atualizarCenasEMidias(nomeZip, indiceArquivo, quantidadeArquivos);
        if (atualizarCore) {
            indiceArquivo += 1;
            await baixarArquivoAtomico(UPDATE_FILES.whatsapp.name, UPDATE_FILES.whatsapp.path, true, indiceArquivo, quantidadeArquivos);
            indiceArquivo += 1;
            await baixarArquivoAtomico(UPDATE_FILES.ffmpeg.name, UPDATE_FILES.ffmpeg.path, true, indiceArquivo, quantidadeArquivos);
        }
        if (atualizarProjeto) {
            indiceArquivo += 1;
            await baixarArquivoAtomico(UPDATE_FILES.project.name, UPDATE_FILES.project.path, false, indiceArquivo, quantidadeArquivos);
        }
        if (currentUpdateVersion) {
            await taskerCall('writeFile', { path: VERSION_FILE_PATH, text: currentUpdateVersion, append: false });
        }
        const typeProject = typeProjectParaAtualizacao(tipo);
        if (!typeProject) throw new Error('Tipo de projeto da atualização não identificado.');
        iniciarContagemFinal(atualizarProjeto, typeProject);
    } catch (erroAtualizacao) {
        updateRunning = false;
        mostrarStatus('Não foi possível concluir: ' + String((erroAtualizacao && erroAtualizacao.message) || erroAtualizacao), 'error');
        if (botao) {
            botao.disabled = false;
            botao.textContent = 'TENTAR NOVAMENTE';
            botao.onclick = function () { executarAtualizacao(currentUpdateType); };
        }
    }
}

function initApp(){
    const updateNowButton = document.getElementById('updateNowButton');
    const versionBadge = document.getElementById('versionBadge');
    const updateCard = document.getElementById('updateCard');
    const noUpdateCard = document.getElementById('noUpdateCard');
    const changelogSection = document.getElementById('changelogSection');
    const expandChangelogButton = document.getElementById('expandChangelogButton');
    const changelogContent = document.getElementById('changelogContent');
    const chevronIcon = document.getElementById('chevronIcon');

    // 1) versao local do arquivo; 2) checagem da release com ela já definida
    // (deterministico, sem piscar o card com avaliação provisória)
    lerVersaoLocal()
        .then(function () {
            return checkReleaseUpdate(versionBadge, updateCard, noUpdateCard);
        })
        .catch(function () {
            checkReleaseUpdate(versionBadge, updateCard, noUpdateCard).catch(function () { });
        });

    if (updateNowButton) {
        updateNowButton.onclick = function () {
            if (currentUpdateType) executarAtualizacao(currentUpdateType);
        };
    }

    // 1.1: alternacao do changelog robusta para o WebView V2 — trata o TOQUE
    // direto (touchend com deteccao de tap pela distancia percorrida e
    // preventDefault para nao gerar clique duplicado) e o clique normal, com
    // guarda de 400ms para nunca alternar duas vezes na mesma interacao; a
    // expansao aplica tambem o maxHeight inline (garantia visual mesmo se a
    // classe sozinha nao aplicar o limite)
    if (expandChangelogButton && changelogContent && chevronIcon && changelogSection) {
        let _ultimoToggleChangelog = 0;
        let _toqueChangelog = null;
        let _toqueFora = null;
        function changelogExpandido(){
            return changelogContent.classList.contains('expanded');
        }
        function alternarChangelog(){
            const agora = Date.now();
            if (agora - _ultimoToggleChangelog < 400) return;
            _ultimoToggleChangelog = agora;
            const vaiExpandir = !changelogExpandido();
            if (vaiExpandir) {
                changelogContent.classList.add('expanded');
                changelogContent.style.maxHeight = '20rem';
            } else {
                changelogContent.classList.remove('expanded');
                changelogContent.style.maxHeight = '';
            }
            chevronIcon.classList.toggle('rotated', vaiExpandir);
        }
        // 1.3: toque/clique FORA da secao recolhe a caixa expandida; o tap e
        // detectado pela distancia percorrida (rolagem nao recolhe) e a guarda
        // de 400ms evita recolher na mesma interacao que expandiu
        function recolherSeFora(eAlvo){
            if (!changelogExpandido()) return;
            const agora = Date.now();
            if (agora - _ultimoToggleChangelog < 400) return;
            if (eAlvo && changelogSection.contains(eAlvo)) return;
            _ultimoToggleChangelog = agora;
            changelogContent.classList.remove('expanded');
            changelogContent.style.maxHeight = '';
            chevronIcon.classList.toggle('rotated', false);
        }
        function posicaoToque(eToque){
            const t = (eToque && eToque.changedTouches && eToque.changedTouches[0]) || null;
            return t ? { x: t.clientX, y: t.clientY } : null;
        }
        expandChangelogButton.addEventListener('touchstart', function (eInicio) {
            _toqueChangelog = posicaoToque(eInicio);
        });
        expandChangelogButton.addEventListener('touchend', function (eFim) {
            const inicio = _toqueChangelog;
            _toqueChangelog = null;
            const fim = posicaoToque(eFim);
            if (!inicio || !fim) return;
            const dx = fim.x - inicio.x;
            const dy = fim.y - inicio.y;
            if (dx * dx + dy * dy > 144) return;
            if (eFim.cancelable) eFim.preventDefault();
            alternarChangelog();
        });
        expandChangelogButton.addEventListener('click', function () {
            alternarChangelog();
        });
        document.addEventListener('touchstart', function (eInicio) {
            _toqueFora = posicaoToque(eInicio);
        }, { passive: true });
        document.addEventListener('touchend', function (eFim) {
            const inicio = _toqueFora;
            _toqueFora = null;
            const fim = posicaoToque(eFim);
            if (!inicio || !fim) return;
            const dx = fim.x - inicio.x;
            const dy = fim.y - inicio.y;
            if (dx * dx + dy * dy > 144) return;
            recolherSeFora(eFim.target);
        });
        document.addEventListener('click', function (eClique) {
            recolherSeFora(eClique.target);
        });
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
} else {
    initApp();
}
