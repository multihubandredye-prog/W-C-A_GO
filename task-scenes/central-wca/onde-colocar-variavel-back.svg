<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="destaque" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#fundo)"/>
  <text x="360" y="64" fill="#e8edf2" font-family="sans-serif" font-size="27" font-weight="bold" text-anchor="middle">BOTÃO VOLTAR — ONDE COLOCAR A VARIÁVEL</text>
  <text x="360" y="95" fill="#8b98a5" font-family="sans-serif" font-size="17" text-anchor="middle">Editor da cena · Tratamento de eventos · Manipulador 1</text>

  <!-- ===== PASSO 1 ===== -->
  <text x="48" y="150" fill="#4dd0b1" font-family="sans-serif" font-size="20" font-weight="bold">1 · EVENTO DA TELA</text>

  <rect x="48" y="168" width="624" height="70" rx="14" fill="#161f2a" stroke="#24303d"/>
  <rect x="66" y="186" width="188" height="36" rx="18" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="160" y="210" fill="#5eead4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✓ Voltar Pressionado</text>
  <text x="640" y="210" fill="#566270" font-family="sans-serif" font-size="14" text-anchor="end">selecione a TELA (root)</text>

  <!-- Cancelar Evento -->
  <rect x="48" y="252" width="624" height="66" rx="14" fill="#161f2a" stroke="#24303d"/>
  <text x="70" y="292" fill="#aeb9c4" font-family="sans-serif" font-size="18">Cancelar Evento</text>
  <rect x="300" y="266" width="180" height="38" rx="8" fill="#1d4ed8"/>
  <text x="390" y="291" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Ligado ▾</text>
  <text x="650" y="291" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end">mude de “Desligado”</text>

  <!-- Campo da expressao (DESTAQUE) -->
  <rect x="48" y="330" width="624" height="86" rx="14" fill="#1a2410" stroke="url(#destaque)" stroke-width="3"/>
  <text x="70" y="362" fill="#c9b458" font-family="sans-serif" font-size="15" font-weight="bold">EXPRESSÃO DO CANCELAR EVENTO — COLE AQUI ↓</text>
  <text x="88" y="398" fill="#ffe08a" font-family="monospace" font-size="24" font-weight="bold">%wca_modal_aberto</text>

  <!-- seta chamando o campo -->
  <path d="M 620 432 L 660 470 L 700 432 Z" fill="#ffd34d"/>
  <text x="660" y="496" fill="#ffd34d" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">AQUI!</text>

  <text x="48" y="540" fill="#8b98a5" font-family="sans-serif" font-size="15">Essa variável NÃO precisa ser criada: a cena 1.16 publica</text>
  <text x="48" y="563" fill="#8b98a5" font-family="sans-serif" font-size="15">sozinha o id do modal aberto (vazio = nenhum modal).</text>

  <!-- ===== PASSO 2 ===== -->
  <text x="48" y="625" fill="#4dd0b1" font-family="sans-serif" font-size="20" font-weight="bold">2 · AÇÃO DO MANIPULADOR</text>

  <rect x="48" y="643" width="624" height="196" rx="14" fill="#161f2a" stroke="#24303d"/>
  <text x="70" y="678" fill="#aeb9c4" font-family="sans-serif" font-size="17" font-weight="bold">Adicionar Ação → Definir Variável</text>

  <rect x="70" y="698" width="260" height="44" rx="8" fill="#0f1720" stroke="#2dd4bf" stroke-width="2"/>
  <text x="86" y="726" fill="#5eead4" font-family="monospace" font-size="19" font-weight="bold">return_modal</text>
  <text x="346" y="726" fill="#566270" font-family="sans-serif" font-size="14">variável</text>

  <rect x="410" y="698" width="160" height="44" rx="8" fill="#0f1720" stroke="#2dd4bf" stroke-width="2"/>
  <text x="426" y="726" fill="#5eead4" font-family="monospace" font-size="19" font-weight="bold">1</text>
  <text x="586" y="726" fill="#566270" font-family="sans-serif" font-size="14">valor</text>

  <text x="70" y="778" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold">✗ APAGUE a ação “Executar Ação do Componente”</text>
  <text x="70" y="801" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold">(goBack) que estava nos parâmetros</text>

  <!-- ===== COMO FICA O COMPORTAMENTO ===== -->
  <text x="48" y="880" fill="#4dd0b1" font-family="sans-serif" font-size="20" font-weight="bold">3 · COMO FICA (a partir da 1.16)</text>

  <rect x="48" y="898" width="624" height="290" rx="14" fill="#161f2a" stroke="#24303d"/>
  <text x="72" y="934" fill="#e8edf2" font-family="sans-serif" font-size="16">☰  Menu aberto</text>
  <text x="640" y="934" fill="#7dd3fc" font-family="monospace" font-size="15" text-anchor="end">voltar → fecha o menu</text>

  <line x1="72" y1="950" x2="648" y2="950" stroke="#24303d"/>

  <text x="72" y="982" fill="#e8edf2" font-family="sans-serif" font-size="16">☰ Menu → “Desativar WCA” → confirmação</text>
  <text x="640" y="982" fill="#7dd3fc" font-family="monospace" font-size="15" text-anchor="end">voltar → volta pro MENU ✓</text>

  <line x1="72" y1="998" x2="648" y2="998" stroke="#24303d"/>

  <text x="72" y="1030" fill="#e8edf2" font-family="sans-serif" font-size="16">☰ Menu → Premium → confirmação</text>
  <text x="640" y="1030" fill="#7dd3fc" font-family="monospace" font-size="15" text-anchor="end">voltar → volta ao anterior</text>

  <line x1="72" y1="1046" x2="648" y2="1046" stroke="#24303d"/>

  <text x="72" y="1078" fill="#e8edf2" font-family="sans-serif" font-size="16">Nenhum modal aberto</text>
  <text x="640" y="1078" fill="#fbbf24" font-family="monospace" font-size="15" text-anchor="end">voltar → fecha a cena</text>

  <text x="72" y="1120" fill="#8b98a5" font-family="sans-serif" font-size="14">A cena sabe de onde cada confirmação veio e reabre a tela de origem</text>
  <text x="72" y="1140" fill="#8b98a5" font-family="sans-serif" font-size="14">(Menu, Premium, Avaliações…), um passo por vez.</text>

  <!-- rodape -->
  <rect x="48" y="1210" width="624" height="46" rx="12" fill="#134e4a"/>
  <text x="360" y="1240" fill="#a7f3d0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Depois: salvar a cena · clear_cache · reload</text>
</svg>
