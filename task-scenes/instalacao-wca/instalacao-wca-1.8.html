<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalando WCA</title>
    <style>
:root {
    --bg-body:   #000;
    --bg-card:   #06222A;
    --primary:   #0F9DCB;
    --accent:    #B5FB2A;
    --border:    #0F507A;
    --text-main: #C6E3DC;
    --text-dim:  #8494A4;
    --color-0:   #ff4d4d;
    --color-10:  #ff794d;
    --color-20:  #ffa64d;
    --color-30:  #ffd24d;
    --color-40:  #ffff4d;
    --color-50:  #d2ff4d;
    --color-60:  #a6ff4d;
    --color-70:  #79ff4d;
    --color-80:  #4dff4d;
    --color-90:  #4dff79;
    --color-100: #4dffa6;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Exo 2', sans-serif;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
}

body {
    background-color: var(--bg-body);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background-image:
        radial-gradient(ellipse at 20% 20%, rgba(15,157,203,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(181,251,42,0.04) 0%, transparent 50%);
}

.main-container {
    width: 100%;
    max-width: 25rem;
    background: var(--bg-card);
    border-radius: 1.25rem;
    border: 0.0625rem solid #0F9DCB55;
    box-shadow: 0 1.5rem 3rem rgba(0,0,0,0.7), 0 0 1.5rem rgba(15,157,203,0.14);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    margin-bottom: 1.5rem;
}

.main-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0.125rem;
    background: linear-gradient(90deg, transparent, #0F9DCB, transparent);
    z-index: 2;
}

.panel-header {
    padding: 1rem;
    background: rgba(0,0,0,0.3);
    border-bottom: 0.0625rem solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-video {
    width: 3.2rem;
    height: 3.2rem;
    border-radius: 50%;
    object-fit: cover;
}

.panel-header h2 {
    font-size: 0.8rem;
    flex: 1;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.1rem;
    font-family: 'Orbitron', sans-serif;
}

.accent-text { color: var(--accent); }

.content-area {
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
}

.progress-container {
    position: relative;
    width: 10rem;
    height: 10rem;
    display: flex;
    justify-content: center;
    align-items: center;
}

.progress-ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    filter: drop-shadow(0 0 0.4rem rgba(15,157,203,0.4));
}

.progress-ring__background {
    stroke: rgba(0,0,0,0.3);
    stroke-width: 12;
    fill: transparent;
}

.progress-ring__circle {
    stroke: var(--color-0);
    stroke-width: 12;
    fill: transparent;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
}

.progress-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--text-main);
    font-family: 'Orbitron', sans-serif;
}

.status-info { text-align: center; width: 100%; }

#status-message {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    min-height: 1.2em;
    letter-spacing: 0.025rem;
}

.timer {
    font-size: 0.7rem;
    color: var(--primary);
    font-weight: 600;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.05rem;
}

.info-section {
    width: 100%;
    max-width: 25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.info-card {
    width: 100%;
    background: var(--bg-card);
    border: 0.0625rem solid var(--border);
    border-radius: 0.875rem;
    padding: 1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(0.75rem);
    transition: opacity 0.5s ease, transform 0.5s ease;
    display: none;
}

.info-card.visible { display: block; }
.info-card.show { opacity: 1; transform: translateY(0); }

.info-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0.125rem;
    background: linear-gradient(90deg, transparent, var(--card-accent, var(--primary)), transparent);
}

.info-label {
    display: inline-block;
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    padding: 0.1rem 0.5rem;
    border-radius: 1rem;
    margin-bottom: 0.5rem;
    background: rgba(255,255,255,0.06);
    color: var(--card-accent, var(--primary));
    border: 0.0625rem solid var(--card-accent, var(--primary));
    font-family: 'Orbitron', sans-serif;
}

.info-card .info-icon {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0.2rem auto 0.5rem;
    color: var(--card-accent, var(--primary));
}

.info-card .info-icon svg {
    width: 1.5rem; height: 1.5rem;
    stroke: currentColor; stroke-width: 1.6; fill: none;
}

.info-card .info-text {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.035rem;
    text-transform: uppercase;
    color: var(--card-text, var(--text-main));
    line-height: 1.4;
}

.info-progress-bar {
    margin-top: 0.75rem;
    height: 0.125rem;
    width: 100%;
    background: rgba(255,255,255,0.05);
    border-radius: 0.125rem;
    overflow: hidden;
}

.info-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--card-bar-a, var(--primary)), var(--card-bar-b, var(--accent)));
}


.theme-cyan   { --card-accent:#0F9DCB; --card-text:#C6E3DC; --card-bar-a:#0F9DCB; --card-bar-b:#B5FB2A; }
.theme-green  { --card-accent:#4dff79; --card-text:#c6ffda; --card-bar-a:#4dff79; --card-bar-b:#B5FB2A; }
.theme-purple { --card-accent:#b06aff; --card-text:#e8d6ff; --card-bar-a:#b06aff; --card-bar-b:#ff6af5; }
.theme-orange { --card-accent:#ff9f4a; --card-text:#ffe8cc; --card-bar-a:#ff9f4a; --card-bar-b:#ffd24d; }
.theme-pink   { --card-accent:#ff5fa0; --card-text:#ffd6e8; --card-bar-a:#ff5fa0; --card-bar-b:#ff9f4a; }
.theme-teal   { --card-accent:#00e5c8; --card-text:#ccfff8; --card-bar-a:#00e5c8; --card-bar-b:#0F9DCB; }
.theme-red    { --card-accent:#ff4d6a; --card-text:#ffd6dc; --card-bar-a:#ff4d6a; --card-bar-b:#ff9f4a; }
.theme-ice    { --card-accent:#7de8ff; --card-text:#e0f8ff; --card-bar-a:#7de8ff; --card-bar-b:#4dffef; }
.theme-warn   {
    --card-accent:#ffd24d; --card-text:#fff3cc; --card-bar-a:#ffd24d; --card-bar-b:#ff9f4a;
    animation: warnPulse 2s ease-in-out infinite;
}

@keyframes warnPulse {
    0%,100% { box-shadow: 0 0 1rem rgba(255,210,77,0.10); }
    50%     { box-shadow: 0 0 1.75rem rgba(255,210,77,0.25); }
}


.install-actions {
    display: flex;
    justify-content: center;
    gap: 0.65rem;
    width: min(92vw, 28rem);
    margin: 0.8rem auto 4.2rem;
}
.install-action-btn {
    flex: 1;
    min-height: 2.8rem;
    padding: 0.7rem 0.9rem;
    border: 0.0625rem solid rgba(15,157,203,0.5);
    border-radius: 0.75rem;
    background: rgba(4,18,28,0.94);
    color: var(--text-main);
    font-family: 'Exo 2', sans-serif;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06rem;
    cursor: pointer;
    touch-action: manipulation;
}
.install-action-btn:active {
    transform: scale(0.98);
    border-color: var(--accent);
}
.install-action-btn.primary {
    color: #061018;
    border-color: var(--accent);
    background: var(--accent);
}
.install-action-btn:disabled { opacity: 0.55; }
.install-countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    margin-top: 0.55rem;
    color: var(--text-dim);
    font-size: 0.72rem;
}
.install-counter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border: 0.0625rem solid var(--accent);
    border-radius: 50%;
    color: var(--accent);
    font-weight: 900;
}
.d-none { display: none !important; }

.main-footer {
    position: fixed;
    bottom: 0.75rem;
    width: 100%;
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-dim);
}

.dev-name { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

    <div class="main-container">
        <header class="panel-header">
            <video src="file:///storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons/video-system.mp4" class="header-video" autoplay loop muted playsinline></video>
            <h2><span class="accent-text">INSTALANDO</span></h2>
            <video src="file:///storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons/video-system.mp4" class="header-video" autoplay loop muted playsinline></video>
        </header>
        <div class="content-area">
            <div class="progress-container">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <circle class="progress-ring__background" r="90" cx="100" cy="100"/>
                    <circle class="progress-ring__circle"     r="90" cx="100" cy="100"/>
                </svg>
                <span id="progress-text" class="progress-text">0%</span>
            </div>
            <div class="status-info">
                <div id="status-message">Aguardando início...</div>
                <div class="timer">
                    <span>Tempo decorrido: </span>
                    <span id="timer-display">00:00</span>
                </div>

    <div class="info-section">

            <span class="info-label" id="info-label">RECURSO</span>
            <div class="info-icon"   id="info-icon"></div>

                <div class="info-progress-fill" id="info-progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="install-actions">
        <button id="install-retry" class="install-action-btn d-none" type="button">TENTAR NOVAMENTE</button>
        <button id="install-now" class="install-action-btn primary d-none" type="button">INSTALAR AGORA</button>

    <footer class="main-footer">

    </footer>

    <script>
const RELEASES_URL = 'https://api.github.com/repos/multihubandredye-prog/W-C-A_GO/releases?per_page=30';
const BIN_DIR = '/data/data/net.dinglisch.android.taskerm/files/WCA';
const PROJECT_PATH = '/storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/system/tasks-send/W_C_A_API.prj.xml';
const SCREEN_ID = '1';
const COUNTDOWN_SECONDS = 10;
const AUTO_CLOSE_DELAY_MS = 600;
const FILES = {
    whatsapp: { name: 'whatsapp-wca-aarch64.bin', path: BIN_DIR + '/whatsapp-wca-aarch64.bin', executable: true, label: 'ARQUIVO 1', theme: 'theme-purple', icon: 'file', text: 'BAIXANDO WHATSAPP WCA' },
    ffmpeg: { name: 'ffmpeg-wca-aarch64.bin', path: BIN_DIR + '/ffmpeg-wca-aarch64.bin', executable: true, label: 'ARQUIVO 2', theme: 'theme-teal', icon: 'music', text: 'BAIXANDO FFMPEG WCA' },
    project: { name: 'W_C_A_API.prj.xml', path: PROJECT_PATH, executable: false, label: 'PROJETO', theme: 'theme-orange', icon: 'xml', text: 'BAIXANDO WCA API.PRJ.XML' }
};
const MODES = {
    'project-api': [FILES.whatsapp, FILES.ffmpeg],
    'project-task': [FILES.project],
    'project-full': [FILES.whatsapp, FILES.ffmpeg, FILES.project],
    'full': [FILES.whatsapp, FILES.ffmpeg, FILES.project]
};
const ICONS = {
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    xml: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/>'
};
const APP_STATE = { mode: 'project-api', files: [], startTime: Date.now(), percent: 0, running: false, completed: false, continuationStarted: false, countdownTimer: null, hasProject: false };
window.WCA_INSTALL_SCENE = {
    isCompleted: function () { return APP_STATE.completed; },
    percent: function () { return APP_STATE.percent; },
    mode: function () { return APP_STATE.mode; }
};

function getBridge() {
    if (typeof Tasker !== 'undefined') return Tasker;
    if (typeof window !== 'undefined' && window.Tasker) return window.Tasker;
    return null;
}

async function taskerCall(name, options) {
    const bridge = getBridge();
    if (!bridge || typeof bridge[name] !== 'function') throw new Error('Tasker.' + name + ' indisponível. Verifique Allow Phone Access.');
    return await bridge[name](options);
}

function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
function shellQuote(value) { return "'" + String(value).replace(/'/g, "'\\''") + "'"; }
function parentPath(path) { return path.slice(0, path.lastIndexOf('/')) || '/'; }

function variableText(value) {
    if (value === null || value === undefined) return '';
    if (typeof value === 'string') return value;
    if (typeof value === 'object') {
        const keys = ['value', 'contents', 'text', 'result', 'stdout'];
        for (let i = 0; i < keys.length; i++) {
            if (value[keys[i]] !== null && value[keys[i]] !== undefined) return String(value[keys[i]]);
        }
    }
    return String(value);
}

function formatBytes(bytes) {
    const value = Math.max(0, Number(bytes || 0));
    if (value >= 1048576) return (value / 1048576).toFixed(1).replace('.', ',') + ' MB';
    if (value >= 1024) return (value / 1024).toFixed(1).replace('.', ',') + ' KB';
    return String(Math.floor(value)) + ' B';
}

function closeOwnScene() {
    const bridge = getBridge();
    if (!bridge) return false;
    const attempts = [
        function () { return bridge.dismissSceneV2(SCREEN_ID); },
        function () { return bridge.dismissLayout(SCREEN_ID); },
        function () { return bridge.cancelScreen(''); },
        function () { return bridge.runTask({ name: '003-FECHAR_INSTALACAO [wca]', variables: { par1: 'fechar-cena' } }); }
    ];
    for (let i = 0; i < attempts.length; i++) {
        try {
            const result = attempts[i]();
            if (result && typeof result.catch === 'function') result.catch(function () {});
            return true;
        } catch (errorClose) {}
    }
    return false;
}

document.addEventListener('DOMContentLoaded', function () {
    const progressRing = document.querySelector('.progress-ring__circle');
    const progressText = document.getElementById('progress-text');
    const statusMessage = document.getElementById('status-message');
    const timerDisplay = document.getElementById('timer-display');
    const infoCard = document.getElementById('info-card');
    const infoLabel = document.getElementById('info-label');
    const infoIcon = document.getElementById('info-icon');
    const infoText = document.getElementById('info-text');
    const infoFill = document.getElementById('info-progress-fill');
    const retryButton = document.getElementById('install-retry');
    const installButton = document.getElementById('install-now');
    const closeButton = document.getElementById('install-close');
    const radius = 90;
    const circumference = 2 * Math.PI * radius;
    if (progressRing) progressRing.style.strokeDasharray = String(circumference) + ' ' + String(circumference);

    function getColor(value) {
        if (value < 10) return 'var(--color-0)';
        if (value < 20) return 'var(--color-10)';
        if (value < 30) return 'var(--color-20)';
        if (value < 40) return 'var(--color-30)';
        if (value < 50) return 'var(--color-40)';
        if (value < 60) return 'var(--color-50)';
        if (value < 70) return 'var(--color-60)';
        if (value < 80) return 'var(--color-70)';
        if (value < 90) return 'var(--color-80)';
        if (value < 100) return 'var(--color-90)';
        return 'var(--color-100)';
    }

    function setProgress(value, message) {
        const current = Math.max(0, Math.min(100, Number(value) || 0));
        APP_STATE.percent = current;
        if (progressRing) {
            progressRing.style.strokeDashoffset = String(circumference - current / 100 * circumference);
            progressRing.style.stroke = getColor(current);
        }
        if (progressText) progressText.textContent = String(Math.round(current)) + String.fromCharCode(37);
        if (message && statusMessage) statusMessage.textContent = message;
    }

    function setStage(file, index, total) {
        if (!file || !infoCard) return;
        infoCard.classList.remove('show');
        infoLabel.textContent = total > 1 ? 'ARQUIVO ' + String(index + 1) + ' DE ' + String(total) : file.label;
        infoText.textContent = file.text;
        infoCard.className = 'info-card visible ' + file.theme;
        infoIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[file.icon] || ICONS.file) + '</svg>';
        infoFill.style.transition = 'none';
        infoFill.style.width = '0' + String.fromCharCode(37);
        void infoCard.offsetWidth;
        infoCard.classList.add('show');
    }

    function setFileProgress(downloaded, totalBytes, index, totalFiles) {
        const fraction = totalBytes > 0 ? Math.max(0, Math.min(1, downloaded / totalBytes)) : 0;
        const globalProgress = (index + fraction) / totalFiles * 100;
        setProgress(globalProgress, 'Baixando ' + APP_STATE.files[index].name + ': ' + formatBytes(downloaded) + (totalBytes > 0 ? ' de ' + formatBytes(totalBytes) : ''));
        if (infoFill) infoFill.style.width = String(Math.round(fraction * 100)) + String.fromCharCode(37);
    }

    function hideActions() {
        retryButton.classList.add('d-none');
        installButton.classList.add('d-none');
        closeButton.classList.add('d-none');
    }

    async function runShell(command, timeout) {
        const result = await taskerCall('runShell', { cmd: command, root: false, timeout: timeout || 60 });
        const code = result && result.result !== undefined && result.result !== '' ? Number(result.result) : 0;
        if (!result || code !== 0) throw new Error('Falha ao preparar o arquivo no armazenamento.');
        return result;
    }

    async function fileSize(path) {
        try {
            const result = await taskerCall('runShell', { cmd: 'if [ -f ' + shellQuote(path) + ' ]; then wc -c < ' + shellQuote(path) + "; else printf '0'; fi", root: false, timeout: 20 });
            const size = Number(String(result && result.stdout || '0').trim());
            return Number.isFinite(size) && size > 0 ? size : 0;
        } catch (errorSize) { return 0; }
    }

    async function getReleasePackage(mode) {
        setProgress(0, 'Consultando a release mais recente...');
        const response = await fetch(RELEASES_URL, { headers: { 'User-Agent': 'WCA-Install', 'Accept': 'application/vnd.github+json' } });
        if (!response || !response.ok) throw new Error('Não foi possível consultar as releases do WCA.');
        const releases = await response.json();
        if (!Array.isArray(releases)) throw new Error('A resposta das releases é inválida.');
        const titlePattern = /\[\s*(ui|core|full)\s*\]/i;
        const testPattern = /^\s*teste\s*$/i;
        const required = MODES[mode] || MODES['project-api'];
        for (let i = 0; i < releases.length; i++) {
            const release = releases[i] || {};
            const title = String(release.name || '');
            if (!titlePattern.test(title) && !testPattern.test(title)) continue;
            const assets = {};
            const list = Array.isArray(release.assets) ? release.assets : [];
            for (let a = 0; a < list.length; a++) {
                const item = list[a] || {};
                const name = String(item.name || '');
                if (name) assets[name] = { url: String(item.browser_download_url || ''), size: Number(item.size || 0) };
            }
            const complete = required.every(function (file) { return assets[file.name] && assets[file.name].url; });
            if (complete) return assets;
        }
        throw new Error('Nenhuma release válida contém todos os arquivos necessários.');
    }

    async function downloadFile(asset, file, index, totalFiles) {
        if (!asset || !asset.url) throw new Error('A release não possui o arquivo ' + file.name + '.');
        const temporary = file.path + '.update';
        setStage(file, index, totalFiles);
        setFileProgress(0, asset.size, index, totalFiles);
        await runShell('mkdir -p ' + shellQuote(parentPath(file.path)) + ' && rm -f ' + shellQuote(temporary), 30);
        try {
            let finished = false;
            let downloadError = null;
            const request = taskerCall('httpRequest', { method: 'GET', url: asset.url, headers: 'User-Agent: Tasker\nAccept: application/octet-stream', fileToSave: temporary, timeout: 600, autoRedirect: true });
            const controlled = Promise.resolve(request).then(function () { finished = true; }).catch(function (error) { downloadError = error; finished = true; });
            while (!finished) {
                await sleep(450);
                setFileProgress(await fileSize(temporary), asset.size, index, totalFiles);
            }
            await controlled;
            if (downloadError) throw downloadError;
            const finalSize = await fileSize(temporary);
            setFileProgress(finalSize, asset.size || finalSize, index, totalFiles);
            let validate = 'test -s ' + shellQuote(temporary);
            if (asset.size > 0) validate += ' && test "$(wc -c < ' + shellQuote(temporary) + ')" -eq ' + String(Math.floor(asset.size));
            if (!file.executable) validate += " && grep -q '<TaskerData' " + shellQuote(temporary);
            validate += ' && mv -f ' + shellQuote(temporary) + ' ' + shellQuote(file.path);
            if (file.executable) validate += ' && chmod 700 ' + shellQuote(file.path);
            await runShell(validate, 120);
            setProgress((index + 1) / totalFiles * 100, file.name + ' validado.');
            if (infoFill) infoFill.style.width = '100' + String.fromCharCode(37);
        } catch (errorDownload) {
            try { await runShell('rm -f ' + shellQuote(temporary), 20); } catch (errorCleanup) {}
            throw errorDownload;
        }
    }

    function stopCountdown() {
        if (APP_STATE.countdownTimer !== null) {
            clearInterval(APP_STATE.countdownTimer);
            APP_STATE.countdownTimer = null;
        }
    }

    async function continueInstallation() {
        if (APP_STATE.continuationStarted) return;
        APP_STATE.continuationStarted = true;
        stopCountdown();
        installButton.disabled = true;
        installButton.textContent = 'INSTALANDO...';
        if (statusMessage) statusMessage.textContent = 'Executando a reinstalação no Tasker...';
        try {
            await taskerCall('runTask', { name: '006-CONFIGURAR_SISTEMA [wca]', variables: { par1: 'force-reinstall-task', bottom: 'yes' } });
            APP_STATE.running = false;
            APP_STATE.completed = true;
            setProgress(100, 'Instalação iniciada no Tasker.');
            installButton.classList.add('d-none');
            closeButton.classList.remove('d-none');
            setTimeout(closeOwnScene, AUTO_CLOSE_DELAY_MS);
        } catch (errorTask) {
            APP_STATE.running = false;
            APP_STATE.continuationStarted = false;
            if (statusMessage) statusMessage.textContent = 'Os arquivos foram validados, mas a tarefa não pôde ser executada: ' + String(errorTask && errorTask.message || errorTask);
            if (APP_STATE.hasProject) {
                installButton.disabled = false;
                installButton.textContent = 'TENTAR INSTALAR NOVAMENTE';
                installButton.classList.remove('d-none');
            } else retryButton.classList.remove('d-none');
            closeButton.classList.remove('d-none');
        }
    }

    function startCountdown() {
        stopCountdown();
        APP_STATE.continuationStarted = false;
        let remaining = COUNTDOWN_SECONDS;
        installButton.disabled = false;
        installButton.textContent = 'INSTALAR AGORA';
        installButton.classList.remove('d-none');
        const draw = function () {
            if (statusMessage) statusMessage.innerHTML = '<strong>Projeto XML baixado e validado.</strong><div class="install-countdown"><span>Instalação automática em</span><span class="install-counter">' + String(remaining) + '</span></div>';
        };
        draw();
        APP_STATE.countdownTimer = setInterval(function () {
            remaining -= 1;
            if (remaining <= 0) continueInstallation();
            else draw();
        }, 1000);
    }

    async function startInstallation() {
        if (APP_STATE.running) return;
        APP_STATE.running = true;
        APP_STATE.completed = false;
        APP_STATE.continuationStarted = false;
        APP_STATE.startTime = Date.now();
        stopCountdown();
        hideActions();
        installButton.disabled = false;
        installButton.textContent = 'INSTALAR AGORA';
        APP_STATE.files = MODES[APP_STATE.mode] || MODES['project-api'];
        APP_STATE.hasProject = APP_STATE.files.some(function (file) { return file === FILES.project; });
        try {
            const assets = await getReleasePackage(APP_STATE.mode);
            for (let i = 0; i < APP_STATE.files.length; i++) {
                const file = APP_STATE.files[i];
                await downloadFile(assets[file.name], file, i, APP_STATE.files.length);
            }
            if (APP_STATE.hasProject) startCountdown();
            else continueInstallation();
        } catch (errorInstall) {
            APP_STATE.running = false;
            APP_STATE.continuationStarted = false;
            stopCountdown();
            if (statusMessage) statusMessage.textContent = 'Não foi possível concluir: ' + String(errorInstall && errorInstall.message || errorInstall);
            retryButton.classList.remove('d-none');
            closeButton.classList.remove('d-none');
        }
    }

    setInterval(function () {
        const elapsed = Math.floor((Date.now() - APP_STATE.startTime) / 1000);
        const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const seconds = (elapsed - Math.floor(elapsed / 60) * 60).toString().padStart(2, '0');
        if (timerDisplay) timerDisplay.textContent = minutes + ':' + seconds;
    }, 1000);

    retryButton.addEventListener('click', startInstallation);
    installButton.addEventListener('click', continueInstallation);
    closeButton.addEventListener('click', closeOwnScene);

    try {
        const bridge = getBridge();
        if (bridge && typeof bridge.onVariableChanged === 'function') {
            bridge.onVariableChanged('type_project', function (name, value) {
                const receivedMode = variableText(value).trim();
                if (!APP_STATE.running && MODES[receivedMode]) APP_STATE.mode = receivedMode;
            });
        }
    } catch (errorListener) {}

    async function initialize() {
        try {
            const value = await Promise.race([
                taskerCall('getVariable', 'type_project'),
                new Promise(function (_, reject) { setTimeout(function () { reject(new Error('Prazo da leitura excedido.')); }, 4000); })
            ]);
            const initialMode = variableText(value).trim();
            if (MODES[initialMode]) APP_STATE.mode = initialMode;
        } catch (errorInitial) {}
        startInstallation();
    }

    initialize();
});
</script>
</body>
</html>
