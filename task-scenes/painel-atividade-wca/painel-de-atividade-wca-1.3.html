<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsConnectApi | Informações</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* fundo TRANSPARENTE: a cena nao pinta o fundo — o que aparece
               atras e a superficie da propria cena (janela/dialogo) e o
               fundo configurado no componente WebView no editor da cena */
            --bg-body: transparent;
            --bg-card: #06222A;
            --primary: #0F9DCB;
            --accent: #B5FB2A;
            --border: #0F507A;
            --text-main: #C6E3DC;
            --text-dim: #8494A4;
            --gold: #FFD700;
            --btn-no: #ff4d4d;
            --btn-yes: #B5FB2A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 0 4vw;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-container {
            width: 100%;
            background: var(--bg-card);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 35px rgba(0,0,0,0.65);
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-video {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .panel-header h2 {
            font-size: 18px;
            flex: 1;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .accent-text {
            color: var(--accent);
        }

        .info-container {
            padding: 20px 26px;
        }

        .info-text {
            color: var(--text-main);
            line-height: 1.65;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .info-text b, .info-text strong { color: var(--accent); font-weight: 600; }
        .info-text i, .info-text em { color: var(--text-dim); }

        .highlight { color: var(--gold); font-weight: 600; }

        .buttons-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-action {
            flex: 1;
            padding: 9px 14px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-no {
            background: var(--btn-no);
            color: white;
        }

        .btn-yes {
            background: var(--btn-yes);
            color: #000;
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .main-footer {
            padding: 20px 0 35px;
            text-align: center;
            font-size: 13px;
            color: #aaa;
        }

        .dev-name {
            color: var(--accent);
            font-weight: 600;
        }

        .position-top    { justify-content: flex-start; padding-top: 24px; }
        .position-center { justify-content: center;    min-height: 100vh; }
        .position-bottom { justify-content: flex-end;  padding-bottom: 40px; }

        @media (max-width: 520px) {
            .content-wrapper { max-width: 92vw; }
            .panel-header { padding: 12px 18px; }
            .header-video { width: 44px; height: 44px; }
            .panel-header h2 { font-size: 17px; }
            .info-container { padding: 18px 24px; }
            .info-text { font-size: 14.5px; }
            .btn-action { font-size: 12.5px; padding: 8px 12px; }
        }

        @media (max-width: 380px) {
            .buttons-row { flex-direction: column; gap: 10px; }
            .btn-action { padding: 10px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper position-center">

        <div class="main-container">
            <header class="panel-header">
                <video class="header-video" autoplay loop muted playsinline preload="auto" src="file:///storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons/video-system.mp4"></video>
                <h2><span class="accent-text">WHATS CONNECT API</span></h2>
                <video class="header-video" autoplay loop muted playsinline preload="auto" src="file:///storage/emulated/0/Tasker/projects_task/projects/whats-connect-api/icons/video-system.mp4"></video>
            </header>

            <div class="info-container">
                <div id="conteudoPrincipal" class="info-text"></div>
            </div>
        </div>

        <div id="buttonsContainer" class="buttons-row" style="display: none;">
            <button id="btnNao" class="btn-action btn-no">Não</button>
            <button id="btnSim" class="btn-action btn-yes">Sim</button>
        </div>

        <footer class="main-footer">
            <span class="dev-name">Andredye Oliveira Melo</span>
        </footer>

    </div>

    <script>
// WHATS CONNECT API - Painel de Atividade (cena V2, 1.3)
// Toda a informacao exibida vem de variaveis do Tasker lidas em runtime —
// nenhuma variavel é embutida no codigo: msg (conteudo da mensagem),
// color_text (cor do texto), position_mode (posicao vertical: top | center |
// bottom) e bottom_active (true = exibe os botoes). Padrao de chegada
// igual ao open_tab da Central / progress_install da Instalacao: LISTENER
// (variavel definida/trocada com a cena aberta) + SONDAGEM inicial de 8s
// (cobre valores definidos ANTES de abrir). Receita garantida no Tasker:
// definir as variaveis DEPOIS da acao Cena v2 Mostrar.

const WCA_SCENE_SCREEN_ID = '1'; // MESMO "ID da Tela" configurado na acao Cena v2 Mostrar
const AUTO_FECHAMENTO_DELAY_MS = 600; // pausa entre responder e fechar

function getTaskerBridge(){
    if (typeof Tasker !== 'undefined') return Tasker;
    if (typeof window !== 'undefined' && window.Tasker) return window.Tasker;
    return null;
}

async function taskerCall(name, options){
    const api = getTaskerBridge();
    if (!api || typeof api[name] !== 'function') {
        throw new Error('Tasker.' + name + ' indisponivel. Verifique Allow Phone Access.');
    }
    return await api[name](options);
}

function bridgeTimeout(ms){
    return new Promise(function(resolve){ setTimeout(resolve, ms); });
}

const VARIAVEIS_PAINEL = ['msg', 'color_text', 'position_mode', 'bottom_active'];
const resolvidas = { msg: false, color_text: false, position_mode: false, bottom_active: false };

let wrapperEl = null;
let elementoPrincipal = null;
let buttonsContainer = null;

function textoVariavel(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'object') {
        const chaves = ['value', 'contents', 'text', 'result', 'stdout'];
        for (let i = 0; i < chaves.length; i++) {
            if (typeof v[chaves[i]] === 'string') return v[chaves[i]];
            if (v[chaves[i]] !== null && v[chaves[i]] !== undefined) return String(v[chaves[i]]);
        }
    }
    return String(v);
}

// Conteudo da mensagem: mesmo tratamento do projeto original — escapa & < >
// e aplica com quebra de linha preservada; vazio = aviso de mensagem vazia
function aplicarMsg(valor){
    if (!elementoPrincipal) return;
    const conteudo = String(valor || '').trim();
    if (!conteudo) {
        elementoPrincipal.innerHTML = '<i style="color:#999;">(mensagem vazia)</i>';
    } else {
        const seguro = conteudo
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        elementoPrincipal.innerHTML = seguro;
        elementoPrincipal.style.whiteSpace = 'pre-wrap';
        elementoPrincipal.style.wordBreak = 'break-word';
    }
}

function aplicarCor(valor){
    const cor = String(valor || '').trim();
    if (cor && elementoPrincipal) elementoPrincipal.style.color = cor;
}

function aplicarPosicao(valor){
    const modo = String(valor || '').trim().toLowerCase();
    if ((modo === 'top' || modo === 'center' || modo === 'bottom') && wrapperEl) {
        wrapperEl.className = 'content-wrapper position-' + modo;
    }
}

function aplicarBotoes(valor){
    const ativo = String(valor || '').trim().toLowerCase() === 'true';
    if (buttonsContainer) buttonsContainer.style.display = ativo ? 'flex' : 'none';
}

function aplicarVariavel(nome, valor){
    const texto = textoVariavel(valor);
    resolvidas[nome] = true;
    if (nome === 'msg') aplicarMsg(texto);
    else if (nome === 'color_text') aplicarCor(texto);
    else if (nome === 'position_mode') aplicarPosicao(texto);
    else if (nome === 'bottom_active') aplicarBotoes(texto);
}

// LISTENER primeiro (nunca pulado) + SONDAGEM 16x500ms com prazo individual
// de 1,5s por variavel; para quando todas as 4 forem obtidas
function iniciarLeituraVariaveis(){
    try {
        Tasker.onVariableChanged(VARIAVEIS_PAINEL, function (nome, valor) {
            aplicarVariavel(nome, valor);
        });
    } catch (e) {
    }
    let tentativas = 0;
    const cronometro = setInterval(function () {
        tentativas += 1;
        const pendentes = VARIAVEIS_PAINEL.filter(function (nome) { return !resolvidas[nome]; });
        if (pendentes.length === 0) {
            clearInterval(cronometro);
            return;
        }
        pendentes.forEach(function (nome) {
            Promise.race([
                Tasker.getVariable(nome),
                new Promise(function (_, rejeitar) {
                    setTimeout(function () { rejeitar(new Error('prazo da leitura excedido')); }, 1500);
                })
            ])
                .then(function (v) { aplicarVariavel(nome, v); })
                .catch(function () { });
        });
        if (tentativas >= 16) clearInterval(cronometro);
    }, 500);
}

// Autofechamento (mesma cascata validada da Instalacao): dismissSceneV2
// recebe o ID da Tela; fallbacks dismissLayout, cancelScreen e, por ultimo,
// uma tarefa auxiliar com a acao Fechar cena v2
function fecharPropriaCena() {
    const tentativas = [
        function () { return Tasker.dismissSceneV2(WCA_SCENE_SCREEN_ID); },
        function () { return Tasker.dismissLayout(WCA_SCENE_SCREEN_ID); },
        function () { return Tasker.cancelScreen(''); },
        function () { return Tasker.runTask({ name: '003-FECHAR_PAINEL_ATIVIDADE [wca]', variables: { par1: 'fechar-cena' } }).catch(function () { }); }
    ];
    for (let i = 0; i < tentativas.length; i++) {
        try { tentativas[i](); return true; } catch (eTentativa) { }
    }
    return false;
}
function agendarFechamentoProprio() {
    setTimeout(function () { fecharPropriaCena(); }, AUTO_FECHAMENTO_DELAY_MS);
}

// ---- AMBIENTE DO TASKER ----
// Unica saida: os botoes gravam a variavel de tela bottom (yes | no) — que
// volta para a tarefa que exibiu a cena quando ela é dismissada — e fecham
// a cena (mesmo comportamento do projeto original)
let _respondido = false;
async function taskBottom(resposta){
    if (_respondido) return;
    _respondido = true;
    try {
        await Tasker.setVariable('bottom', resposta);
    } catch (eSet) {
    }
    agendarFechamentoProprio();
}

document.addEventListener('DOMContentLoaded', function () {
    wrapperEl = document.querySelector('.content-wrapper');
    elementoPrincipal = document.getElementById('conteudoPrincipal');
    buttonsContainer = document.getElementById('buttonsContainer');
    const btnNao = document.getElementById('btnNao');
    const btnSim = document.getElementById('btnSim');

    if (btnNao) btnNao.addEventListener('click', function () { taskBottom('no'); });
    if (btnSim) btnSim.addEventListener('click', function () { taskBottom('yes'); });

    iniciarLeituraVariaveis();
});
</script>

</body>
</html>
